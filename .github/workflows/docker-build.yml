name: Docker build (reusable)

# Generic, language-agnostic build-and-push workflow.
# The caller supplies everything project-specific (context, Dockerfile,
# artifact, build args). Pass secrets with `secrets: inherit`; this workflow
# reads these repository secrets (dev/prod chosen via the `environment` input):
#   NEXUS_DOCKER_REGISTRY_DEV / NEXUS_DOCKER_REGISTRY_PROD,
#   NEXUS_USERNAME, NEXUS_PASSWORD,
#   NEXUS_HOST, NEXUS_PORT (only when mount-pip-index / mount-npm-registry: true),
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#   COSIGN_PRIVATE_KEY, COSIGN_PASSWORD (only when sign-image: true, release builds)
# or, with secrets-source: openbao, the same values from OpenBao only, never
# from these secrets (docs/openbao-secrets.md).

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image repository name (without registry/owner prefix)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      artifact-name:
        description: "Artifact to download before building (empty = none)"
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Where to extract the downloaded artifact"
        required: false
        type: string
        default: "."
      build-args:
        description: "Newline-separated build args forwarded to build-push-action"
        required: false
        type: string
        default: ""
      release:
        description: "true = semver + latest tags; false = branch + sha tags"
        required: false
        type: boolean
        default: false
      push-to-ghcr:
        required: false
        type: boolean
        default: false
      push-to-dockerhub:
        required: false
        type: boolean
        default: false
      mount-pip-index:
        description: >
          Mount the context's Nexus PyPI index as the `pip_index_url` build
          secret, plus a matching `netrc` secret carrying the credentials.
          Both are composed from NEXUS_HOST / NEXUS_PORT / NEXUS_USERNAME /
          NEXUS_PASSWORD — the same secrets the nexus-context action uses on
          the runner, so the index the image builds against cannot drift from
          the one CI installs from.
        required: false
        type: boolean
        default: false
      mount-npm-registry:
        description: >
          Mount a Nexus npm registry as the `npmrc` build secret, for images
          whose build runs `npm ci` / `npm install`. The npm counterpart of
          mount-pip-index, and needed for the same reason: BuildKit resolves
          `FROM` with its own egress (proxy or mirror), but a RUN step inherits
          none of that, so on a runner without direct internet a package install
          fails inside the build even though the base image pulled fine.
          Composed from NEXUS_HOST / NEXUS_PORT and, when both are set,
          NEXUS_USERNAME / NEXUS_PASSWORD.
        required: false
        type: boolean
        default: false
      npm-registry-repo:
        description: >
          Nexus repository name serving npm packages, e.g. a proxy of
          registry.npmjs.org or a group that includes one. Only read when
          mount-npm-registry is true. Deliberately an input rather than the
          derived `npm-<context>-group` the PyPI side uses: npm repositories here
          are not split per context. Pass a different name (or an expression on
          `environment`) if yours are.
        required: false
        type: string
        default: "npm-proxy"
      insecure-registry:
        description: "Nexus serves the Docker connector over plain HTTP — tell BuildKit to push over HTTP, Cosign to sign over HTTP, and Syft, Grype and Dockle to pull over HTTP instead of TLS"
        required: false
        type: boolean
        default: false
      registry-mirror:
        description: >
          Registry to resolve docker.io images through, as a bare host:port — e.g.
          a Nexus docker proxy/group connector on a different port than the push
          target. Lets `FROM` and `# syntax=` images come from Nexus instead of
          Docker Hub, which is the only route on a runner with no internet egress.
          Empty = pull from Docker Hub directly.
        required: false
        type: string
        default: ""
      registry-mirror-port:
        description: >
          Connector port on the SAME Nexus host as the push target to use as the
          docker.io mirror — typically a group repo that includes the Docker Hub
          proxy (a Nexus proxy repo has no connector of its own, so it is only
          reachable through a group). The host is taken from the registry secret,
          so nothing internal is hardcoded in the caller. Ignored when
          registry-mirror is set explicitly.
        required: false
        type: string
        default: ""
      builder-network:
        description: >
          Network of the docker-container builder (buildkitd), which is the one
          that pushes. `auto` (default): `host` when the registry resolved for
          `environment` is a `*.ocs-registry.local` name, otherwise Docker's
          default bridge. `host` / `bridge` force one or the other. The
          ocs-registry.local names resolve only through the runner node's
          /etc/hosts, to 127.0.0.1, where the routing mesh hands port 80 to
          Traefik. A builder on the default bridge sees neither that file nor
          the runner's overlay aliases, and its 127.0.0.1 is itself, so its push
          fails with "no such host". On the host network it shares the node's
          /etc/hosts and loopback. See docs/docker-build-network.md.
        required: false
        type: string
        default: "auto"
      buildkit-image:
        description: >
          Image the docker-container builder itself runs on, as a full reference —
          e.g. <nexus-host:port>/moby/buildkit:buildx-stable-1. The runner's docker
          daemon pulls this while the builder boots, which happens BEFORE
          buildkitd.toml or the proxy driver-opts below exist, so neither the
          docker.io mirror nor the proxy applies to it. On a runner whose daemon
          has no egress this is the pull that hangs the "Set up Docker Buildx"
          step. Empty = derived from the mirror when one is configured, otherwise
          Docker Hub's moby/buildkit (needs daemon-level egress). A plain-HTTP
          source must be in the daemon's own insecure-registries.
        required: false
        type: string
        default: ""
      environment:
        description: "Target context: 'dev' or 'prod'. Selects which Nexus registry/index secrets are used."
        required: false
        type: string
        default: "dev"
      generate-sbom:
        description: "Generate a CycloneDX SBOM from the built image and upload it to Dependency-Track"
        required: false
        type: boolean
        default: false
      sbom-project-name:
        description: "Dependency-Track project name for the image SBOM (defaults to '<image-name>-image')"
        required: false
        type: string
        default: ""
      sbom-project-version:
        description: "Dependency-Track project version for the image SBOM (usually the release version)"
        required: false
        type: string
        default: ""
      scan-dockerfile:
        description: "Lint the Dockerfile for misconfigurations with Checkov before building"
        required: false
        type: boolean
        default: false
      scan-dockerfile-soft-fail:
        description: "Report Checkov findings without failing the build (true = warn only)"
        required: false
        type: boolean
        default: false
      scan-image:
        description: "Scan the pushed image for vulnerabilities with Grype (fails per scan-severity-cutoff)"
        required: false
        type: boolean
        default: false
      scan-severity-cutoff:
        description: "Lowest severity that fails the build: negligible|low|medium|high|critical"
        required: false
        type: string
        default: "high"
      scan-fail-build:
        description: "Fail the job when a vulnerability at/above scan-severity-cutoff is found (false = report only)"
        required: false
        type: boolean
        default: true
      lint-image:
        description: "Lint the built image against CIS / hardening best practices with Dockle"
        required: false
        type: boolean
        default: false
      lint-image-failure-threshold:
        description: "Dockle level that fails the build: INFO|WARN|FATAL"
        required: false
        type: string
        default: "WARN"
      lint-image-fail-build:
        description: "Fail the job when Dockle findings reach the threshold (false = report only)"
        required: false
        type: boolean
        default: true
      sign-image:
        description: "Sign the pushed image digest with Cosign (key-based). Needs COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets. Release builds only."
        required: false
        type: boolean
        default: false

      runs-on:
        description: "Runner label of every job (e.g. containerized for the container runner pool)"
        required: false
        type: string
        default: self-hosted

      # --- secrets source -------------------------------------------------
      secrets-source:
        description: >
          Where the Nexus, Docker Hub, Dependency-Track and Cosign values come
          from. `github` (default): the repository/organization secrets, as
          before. `openbao`: read them from OpenBao with the job's OIDC token
          (JWT auth), for private repositories that cannot use organization
          secrets. Then OpenBao is the only source: a value it does not give is
          empty, never taken from secrets.* (even with `secrets: inherit`).
          `openbao` needs `permissions: id-token: write` on the calling job, and
          the containerized runner pool (runs-on: containerized).
        required: false
        type: string
        default: github
      openbao-url:
        description: "OpenBao API URL (secrets-source: openbao)"
        required: false
        type: string
        default: "https://openbao:8200"
      openbao-role:
        description: "OpenBao JWT role of this repository, e.g. ci-ocs-operator-app (secrets-source: openbao)"
        required: false
        type: string
        default: ""
      openbao-tools:
        description: >
          Tools whose values come from the devsecops layout
          (devsecops/ci/<dev|prod>/<tool>) instead of ocs/ci/shared, separated by
          single spaces on one line, e.g. "nexus dependency-track"; an unknown
          name or any other separator stops the job. A tool not listed keeps the
          ocs layout. Tag builds read prod and log in as <openbao-role>-release;
          `environment` must then be prod, and dev on any other build (the read
          stops the job otherwise). Cosign is read on release builds with
          sign-image only. Only with secrets-source: openbao.
        required: false
        type: string
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Dockerfile IaC lint — Checkov checks the Dockerfile for security
  # misconfigurations (missing USER / HEALTHCHECK, unpinned base image, etc.)
  # before anything is built or pushed, so a bad Dockerfile fails fast. Set
  # scan-dockerfile-soft-fail to warn instead of block. Language-agnostic.
  #
  # This is a separate job on purpose, not a step in `docker`. The checkov-action
  # that `checkov-scan` wraps is a *container* action (`runs: using: docker`), and
  # the runner pulls the image of every container action in a job during "Set up
  # job" — before any step-level `if:` is evaluated. As a step it therefore
  # pulled ghcr.io/bridgecrewio/checkov on every single build, even with
  # scan-dockerfile false, which breaks runners that cannot reach ghcr.io. A
  # job-level `if` skips the job outright, so nothing is pulled.
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    if: inputs.scan-dockerfile
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Dockerfile (Checkov)
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/checkov-scan@develop
        with:
          file: ${{ inputs.dockerfile }}
          framework: dockerfile
          soft-fail: ${{ inputs.scan-dockerfile-soft-fail }}

  docker:
    needs: dockerfile-lint
    # A skipped `needs` job would skip this one too, so spell the gate out:
    # build unless the lint actually failed. Keeps the fail-fast behaviour
    # (no build/login when the Dockerfile is bad) while letting the common
    # scan-dockerfile: false path through.
    #
    # scan-dockerfile-soft-fail additionally means "never block", and that has
    # to hold for a lint job that failed *before* Checkov ran: checkov-action is
    # a container action, so the runner pulls ghcr.io/bridgecrewio/checkov during
    # "Set up job", and on a runner without ghcr.io egress the job fails there.
    # Without this clause a report-only lint would still stop the build — the one
    # thing report-only promises not to do.
    if: >-
      ${{ !cancelled()
          && (inputs.scan-dockerfile-soft-fail
              || needs.dockerfile-lint.result != 'failure') }}
    runs-on: ${{ inputs.runs-on }}
    # No `permissions:` block on purpose, see node-workflow.yml `docker`: the job
    # takes what the caller grants (contents: read and packages: write to push
    # to GHCR, plus id-token: write in openbao mode) instead of failing every
    # caller that does not grant id-token.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # openbao-tools is matched below with contains(' <tool> '), which takes a
      # misspelled tool, or a list split by newlines, tabs or commas, for no
      # tool at all: the read would quietly keep the ocs layout, out of reach of
      # the action's own check for unknown tools. Refuse such a list here.
      - name: Check openbao-tools
        if: inputs.secrets-source == 'openbao' && inputs.openbao-tools != ''
        shell: bash
        env:
          OPENBAO_TOOLS: ${{ inputs.openbao-tools }}
        run: |
          set -euo pipefail
          known="nexus sonarqube dependency-track dockerhub cosign"
          # One line, one space between names: the only form the matchers see.
          re='^[a-z-]+( [a-z-]+)*$'
          if ! [[ $OPENBAO_TOOLS =~ $re ]]; then
            echo "::error::openbao-tools must be tool names separated by single spaces on one line, e.g. \"nexus sonarqube\" (got $(printf '%q' "$OPENBAO_TOOLS")). Known: $known."
            exit 1
          fi
          for t in $OPENBAO_TOOLS; do
            case " $known " in
              *" $t "*) ;;
              *) echo "::error::Unknown tool '$t' in openbao-tools. Known: $known."; exit 1 ;;
            esac
          done
          echo "openbao-tools: $OPENBAO_TOOLS"

      # Each read sets exactly one of tools / shared: the devsecops layout when the
      # caller lists the tool in openbao-tools, the ocs/ci/shared names otherwise.
      # In the devsecops layout a non-tag build gets only NEXUS_DOCKER_REGISTRY_DEV
      # and a tag build only _PROD; `environment` makes the action stop a build
      # whose environment disagrees, before "Resolve Nexus registry" would.
      - name: Read secrets from OpenBao
        if: inputs.secrets-source == 'openbao'
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/devsecops-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'nexus' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'NEXUS_HOST NEXUS_PORT NEXUS_USERNAME NEXUS_PASSWORD NEXUS_DOCKER_REGISTRY_DEV NEXUS_DOCKER_REGISTRY_PROD' || '' }}
          environment: ${{ inputs.environment }}

      - name: Read Docker Hub secrets from OpenBao
        if: inputs.secrets-source == 'openbao' && inputs.push-to-dockerhub
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/devsecops-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' dockerhub ') && 'dockerhub' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' dockerhub ') && 'DOCKERHUB_USERNAME DOCKERHUB_TOKEN' || '' }}
          environment: ${{ inputs.environment }}

      - name: Read Dependency-Track secrets from OpenBao
        if: inputs.secrets-source == 'openbao' && inputs.generate-sbom
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/devsecops-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' dependency-track ') && 'dependency-track' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' dependency-track ') && 'DEPENDENCYTRACK_URL DEPENDENCYTRACK_API_KEY' || '' }}
          environment: ${{ inputs.environment }}

      # Gated exactly like "Sign image (Cosign)", its only consumer: a branch
      # build never signs, so it must not read the signing key either (in the
      # devsecops layout it would need one in devsecops/ci/dev, or fail).
      - name: Read Cosign secrets from OpenBao
        if: inputs.secrets-source == 'openbao' && inputs.sign-image && inputs.release
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/devsecops-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' cosign ') && 'cosign' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' cosign ') && 'COSIGN_PRIVATE_KEY COSIGN_PASSWORD' || '' }}
          environment: ${{ inputs.environment }}

      - name: Download artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      # Resolved before Buildx is provisioned, because the BuildKit config below
      # needs the registry host.
      - name: Resolve Nexus registry for context
        # Pick the dev or prod Docker registry based on the `environment` input,
        # then normalise and validate it. A registry secret carrying a scheme
        # ("https://host:8082"), a trailing slash, or stray whitespace produces a
        # tag like "https://host:8082/app:develop", which buildx rejects with a
        # bare "invalid reference format". GitHub masks the value, so the log
        # shows only "***/app:develop" and the cause is invisible. Normalise the
        # usual copy-paste damage and fail here, naming the offending secret,
        # instead of several steps later on an unreadable error.
        env:
          RAW_DEV: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_DOCKER_REGISTRY_DEV || (inputs.secrets-source != 'openbao' && secrets.NEXUS_DOCKER_REGISTRY_DEV || '') }}
          RAW_PROD: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_DOCKER_REGISTRY_PROD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_DOCKER_REGISTRY_PROD || '') }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$ENVIRONMENT" = "prod" ]; then
            raw=$RAW_PROD
            name=NEXUS_DOCKER_REGISTRY_PROD
          else
            raw=$RAW_DEV
            name=NEXUS_DOCKER_REGISTRY_DEV
          fi

          if [ -z "$raw" ]; then
            echo "::error::$name is empty or unset. Set it to a bare host:port — no scheme, no path — e.g. nexus.example.local:8082"
            exit 1
          fi

          reg=$(printf '%s' "$raw" | tr -d '[:space:]')
          reg=${reg#http://}
          reg=${reg#https://}
          while [ "${reg%/}" != "$reg" ]; do reg=${reg%/}; done

          # Image references must be lowercase; an uppercase host is another
          # silent source of "invalid reference format".
          if printf '%s' "$reg" | grep -q '[A-Z]'; then
            echo "::error::$name contains uppercase characters — docker image references must be lowercase"
            exit 1
          fi
          case "$reg" in
            *@*)
              echo "::error::$name must not contain '@'"
              exit 1 ;;
          esac

          if [ "$reg" != "$raw" ]; then
            echo "::warning::$name needed normalising (scheme, trailing slash or whitespace removed) — store it as a bare host:port to avoid this"
          fi
          echo "registry resolved from $name (${#reg} characters)"

          echo "NEXUS_DOCKER_REGISTRY=$reg" >> "$GITHUB_ENV"

      - name: Compose BuildKit registry config
        id: buildkit
        # setup-buildx-action provisions a `docker-container` driver — BuildKit
        # runs in its own container with its own registry configuration and does
        # NOT inherit `insecure-registries` from the host's
        # /etc/docker/daemon.json. Against a plain-HTTP Nexus connector that
        # means `docker login` succeeds (daemon) while the push fails (BuildKit).
        # Always write the file so `config:` below has a valid path; an empty
        # buildkitd.toml is the no-op default.
        env:
          PROXY_VAR: ${{ vars.BUILDKIT_HTTP_PROXY }}
          NO_PROXY_VAR: ${{ vars.BUILDKIT_NO_PROXY }}
          MIRROR_INPUT: ${{ inputs.registry-mirror }}
          MIRROR_PORT: ${{ inputs.registry-mirror-port }}
          INSECURE: ${{ inputs.insecure-registry }}
          BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
          BUILDER_NETWORK: ${{ inputs.builder-network }}
        run: |
          set -euo pipefail
          toml="$RUNNER_TEMP/buildkitd.toml"
          : > "$toml"

          # Which network the builder container joins (see the builder-network
          # input). Decided from the resolved registry, not by the caller,
          # because the registry value comes from OpenBao or the secrets: a
          # caller moved onto the ocs-registry.local names needs no change.
          reg_host="${NEXUS_DOCKER_REGISTRY%%:*}"
          case "$BUILDER_NETWORK" in
            auto)
              case "$reg_host" in
                *.ocs-registry.local) net=host ;;
                *) net="" ;;
              esac ;;
            host) net=host ;;
            bridge) net="" ;;
            *)
              echo "::error::builder-network must be auto, host or bridge (got '$BUILDER_NETWORK')"
              exit 1 ;;
          esac
          if [ "$net" = host ]; then
            echo "BuildKit builder joins the runner node's host network (builder-network: $BUILDER_NETWORK, registry host $reg_host): it resolves the registry through the node's /etc/hosts and pushes through its 127.0.0.1"
          fi

          # An explicit host:port wins; otherwise pair the given connector port
          # with the host from the registry secret.
          if [ -n "$MIRROR_INPUT" ]; then
            MIRROR=$MIRROR_INPUT
          elif [ -n "$MIRROR_PORT" ]; then
            MIRROR="${NEXUS_DOCKER_REGISTRY%%:*}:$MIRROR_PORT"
          else
            MIRROR=""
          fi

          # Registries BuildKit must talk to over plain HTTP rather than TLS.
          http_regs=""
          if [ "$INSECURE" = "true" ]; then
            http_regs="$NEXUS_DOCKER_REGISTRY"
            echo "BuildKit will push to $NEXUS_DOCKER_REGISTRY over plain HTTP"
          fi

          # Resolve docker.io through the mirror, so `FROM python:3.11-slim` and
          # the `# syntax=` frontend are fetched from Nexus. This is what makes a
          # build work with no internet egress at all, rather than routing Docker
          # Hub traffic through a proxy.
          if [ -n "$MIRROR" ]; then
            printf '[registry."docker.io"]\n  mirrors = ["%s"]\n' "$MIRROR" >> "$toml"
            echo "BuildKit will resolve docker.io images via $MIRROR"
            if [ "$INSECURE" = "true" ] && [ "$MIRROR" != "$NEXUS_DOCKER_REGISTRY" ]; then
              http_regs="$http_regs $MIRROR"
            fi
          fi

          for r in $http_regs; do
            printf '[registry."%s"]\n  http = true\n' "$r" >> "$toml"
          done

          echo "config=$toml" >> "$GITHUB_OUTPUT"
          echo "mirror=$MIRROR" >> "$GITHUB_OUTPUT"
          # A mirror on its own connector needs its own docker login (see below).
          if [ -n "$MIRROR" ] && [ "$MIRROR" != "$NEXUS_DOCKER_REGISTRY" ]; then
            echo "mirror-login=true" >> "$GITHUB_OUTPUT"
          else
            echo "mirror-login=false" >> "$GITHUB_OUTPUT"
          fi

          # BuildKit inherits neither the host daemon's proxy settings nor the
          # job environment, so resolving `# syntax=` and `FROM` images dials the
          # internet directly — on a proxy-only network that is a plain i/o
          # timeout to registry-1.docker.io. Pass the proxy in as driver env.
          # Prefer the repo/org variable; fall back to an ambient proxy var if
          # the runner exports one. No proxy configured = unchanged behaviour.
          proxy="${PROXY_VAR:-${https_proxy:-${http_proxy:-}}}"

          # The builder runs *on* an image, and the runner's docker daemon pulls
          # that image before buildkitd.toml or the env driver-opts below take
          # effect — so a daemon with no egress hangs in "Set up Docker Buildx"
          # no matter how well BuildKit itself is configured. Serve it from Nexus
          # whenever we know a Docker Hub proxy path there.
          if [ -n "$BUILDKIT_IMAGE" ]; then
            IMAGE=$BUILDKIT_IMAGE
          elif [ -n "$MIRROR" ]; then
            IMAGE="$MIRROR/moby/buildkit:buildx-stable-1"
          else
            IMAGE=""
          fi

          {
            echo "driver-opts<<EOF"
            if [ -n "$IMAGE" ]; then
              echo "image=$IMAGE"
            fi
            # buildkitd then shares the node's network namespace, and so do its
            # RUN steps (the builder image has no CNI): a build can reach what
            # the node reaches. The job already has the node's docker socket,
            # so this grants nothing it did not have.
            if [ "$net" = host ]; then
              echo "network=host"
            fi
            if [ -n "$proxy" ]; then
              echo "env.http_proxy=$proxy"
              echo "env.https_proxy=$proxy"
              # The Nexus registry and the mirror must bypass the proxy, otherwise
              # their traffic is sent to an internet-facing proxy and fails the
              # same way. Both host and host:port are listed — a no_proxy entry
              # carrying a port only matches that port.
              bypass="${NEXUS_DOCKER_REGISTRY%%:*},$NEXUS_DOCKER_REGISTRY"
              if [ -n "$MIRROR" ] && [ "$MIRROR" != "$NEXUS_DOCKER_REGISTRY" ]; then
                bypass="$bypass,${MIRROR%%:*},$MIRROR"
              fi
              # Quoted deliberately, and the quotes are part of the value handed
              # to buildx — not shell syntax. buildx CSV-parses every
              # --driver-opt, so each comma starts what it expects to be another
              # k=v pair and an unquoted list dies at builder creation with
              #   ERROR: invalid value "127.0.0.1", expecting k=v
              # (the second element of BUILDKIT_NO_PROXY). Quoting keeps the list
              # as one CSV field, and Go's proxy matcher accepts only commas as
              # its separator, so the commas cannot be avoided. The other opts
              # above hold no commas and need no quoting.
              #
              # Deduplicated on the way out: a mirror on the same host as the
              # push target repeats that host. Harmless to the matcher, noise in
              # the log.
              np=$(printf '%s' "${NO_PROXY_VAR:+$NO_PROXY_VAR,}$bypass" \
                | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd,)
              echo "\"env.no_proxy=$np\""
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$IMAGE" ]; then
            echo "Builder image: $IMAGE (pulled by the runner's docker daemon)"
          else
            echo "::warning::The builder image will be pulled from Docker Hub by the runner's docker daemon. If 'Set up Docker Buildx' hangs or times out at 'Booting builder', that daemon has no egress to registry-1.docker.io — set buildkit-image to a Nexus path such as <host:port>/moby/buildkit:buildx-stable-1."
          fi

          if [ -n "$proxy" ]; then
            echo "BuildKit egress via proxy (bypassing ${NEXUS_DOCKER_REGISTRY%%:*})"
          elif [ -z "$MIRROR" ]; then
            echo "::warning::BuildKit has neither a proxy nor a docker.io mirror. On a runner without direct internet egress, resolving '# syntax=' or 'FROM' images will time out — set registry-mirror-port to a Nexus group connector that includes the Docker Hub proxy, or the BUILDKIT_HTTP_PROXY repository variable."
          fi

      - name: Set up Docker Buildx
        # Bounded so an unreachable source for the builder image fails in minutes
        # with the warning above in the log, instead of sitting on the daemon's
        # pull until the job timeout.
        timeout-minutes: 8
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
          driver-opts: ${{ steps.buildkit.outputs.driver-opts }}

      - name: Log in to Nexus Docker registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.NEXUS_DOCKER_REGISTRY }}
          username: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          password: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      # BuildKit reads registry credentials from the client's docker config, so a
      # mirror on a different connector than the push target needs its own login —
      # a Nexus group answers /v2/ with 401 for anonymous pulls, which would fail
      # the `FROM` resolution just as an unreachable Docker Hub does.
      - name: Log in to Nexus mirror registry
        if: steps.buildkit.outputs.mirror-login == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ steps.buildkit.outputs.mirror }}
          username: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          password: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      - name: Log in to GitHub Container Registry
        if: inputs.push-to-ghcr
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push-to-dockerhub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ inputs.secrets-source == 'openbao' && env.DOCKERHUB_USERNAME || (inputs.secrets-source != 'openbao' && secrets.DOCKERHUB_USERNAME || '') }}
          password: ${{ inputs.secrets-source == 'openbao' && env.DOCKERHUB_TOKEN || (inputs.secrets-source != 'openbao' && secrets.DOCKERHUB_TOKEN || '') }}

      - name: Compose image list
        id: images
        # Lowercased: OCI repository names must be lowercase. metadata-action
        # lowercases on its own, so the push works either way, but Cosign and
        # the scanners take this list verbatim and reject a mixed-case owner
        # (e.g. ghcr.io/CSC-Operations-Coordination-Service/...).
        run: |
          {
            echo "list<<EOF"
            {
              echo "${{ env.NEXUS_DOCKER_REGISTRY }}/${{ inputs.image-name }}"
              if [ "${{ inputs.push-to-ghcr }}" = "true" ]; then
                echo "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}"
              fi
              if [ "${{ inputs.push-to-dockerhub }}" = "true" ]; then
                echo "${{ inputs.secrets-source == 'openbao' && env.DOCKERHUB_USERNAME || (inputs.secrets-source != 'openbao' && secrets.DOCKERHUB_USERNAME || '') }}/${{ inputs.image-name }}"
              fi
            } | tr '[:upper:]' '[:lower:]'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (dev)
        id: meta_dev
        if: ${{ !inputs.release }}
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Docker metadata (release)
        id: meta_release
        if: ${{ inputs.release }}
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # -----------------------------------------------------------------------
      # Compose the pip build secrets, mirroring the nexus-context action:
      # a credential-free index URL plus a separate ~/.netrc. Keeping the
      # password out of the URL avoids percent-encoding it (an unescaped '@'
      # or ':' silently mangles the netloc) and keeps it out of pip's logs,
      # which print the index URL with only the password redacted.
      # Written to files rather than `secrets:` inline values so the password
      # never appears in a step's argument list.
      # -----------------------------------------------------------------------
      - name: Compose pip index secrets
        if: inputs.mount-pip-index
        env:
          NEXUS_HOST: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_HOST || (inputs.secrets-source != 'openbao' && secrets.NEXUS_HOST || '') }}
          NEXUS_PORT: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PORT || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PORT || '') }}
          NEXUS_USER: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          NEXUS_PASS: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}
          CTX: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ -z "$NEXUS_HOST" ]; then
            echo "::error::mount-pip-index needs the NEXUS_HOST secret (bare hostname, no scheme/port)"
            exit 1
          fi
          case "$NEXUS_HOST" in
            *://*|*/*|*:*)
              echo "::error::NEXUS_HOST must be a bare hostname — no scheme, port or path (got '$NEXUS_HOST')"
              exit 1 ;;
          esac
          if [ -z "$NEXUS_USER" ] || [ -z "$NEXUS_PASS" ]; then
            echo "::error::mount-pip-index needs both NEXUS_USERNAME and NEXUS_PASSWORD"
            exit 1
          fi

          # Empty port = scheme default; drop ':<port>' rather than emitting
          # a dangling 'http://host:/path'.
          if [ -n "$NEXUS_PORT" ]; then
            case "$NEXUS_PORT" in
              *[!0-9]*) echo "::error::NEXUS_PORT must be numeric (got '$NEXUS_PORT')"; exit 1 ;;
            esac
            authority="$NEXUS_HOST:$NEXUS_PORT"
          else
            authority="$NEXUS_HOST"
          fi

          # Same group repositories as pip.<ctx>.conf in the nexus-context action.
          echo "http://$authority/repository/pypi-$CTX-group/simple" \
            > "$RUNNER_TEMP/pip_index_url"

          # pip matches netrc on the bare host: a 'machine host:port' entry is
          # silently never found.
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$NEXUS_HOST" "$NEXUS_USER" "$NEXUS_PASS" > "$RUNNER_TEMP/netrc"
          chmod 600 "$RUNNER_TEMP/pip_index_url" "$RUNNER_TEMP/netrc"

          echo "pip index: http://$authority/repository/pypi-$CTX-group/simple (netrc for '$NEXUS_HOST')"

      # -----------------------------------------------------------------------
      # Compose the npm build secret — the counterpart of the pip step above,
      # for images whose build runs `npm ci`. One file: an .npmrc naming the
      # Nexus registry, plus a scoped `_auth` line when credentials are
      # available. Written to a file rather than an inline `secrets:` value so
      # the credential never appears in a step's argument list.
      #
      # Credentials are OPTIONAL here, unlike the pip step: a Nexus npm proxy is
      # commonly readable anonymously, and requiring them would block that setup
      # for no reason. When both are present the auth line is added, and the
      # base64 blob is masked — GitHub masks the raw secrets, but not a
      # re-encoding of them, so it would otherwise be one `cat` away from the log.
      # -----------------------------------------------------------------------
      - name: Compose npm registry secret
        if: inputs.mount-npm-registry
        env:
          NEXUS_HOST: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_HOST || (inputs.secrets-source != 'openbao' && secrets.NEXUS_HOST || '') }}
          NEXUS_PORT: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PORT || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PORT || '') }}
          NEXUS_USER: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          NEXUS_PASS: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}
          NPM_REPO: ${{ inputs.npm-registry-repo }}
        run: |
          set -euo pipefail

          if [ -z "$NEXUS_HOST" ]; then
            echo "::error::mount-npm-registry needs the NEXUS_HOST secret (bare hostname, no scheme/port)"
            exit 1
          fi
          case "$NEXUS_HOST" in
            *://*|*/*|*:*)
              echo "::error::NEXUS_HOST must be a bare hostname — no scheme, port or path (got '$NEXUS_HOST')"
              exit 1 ;;
          esac

          # A repo name carrying a scheme or a path silently produces a registry
          # URL npm cannot use, and npm's error names only the package it failed
          # to fetch — not the malformed registry.
          if [ -z "$NPM_REPO" ]; then
            echo "::error::npm-registry-repo is empty — set it to the Nexus npm repository name, e.g. npm-proxy"
            exit 1
          fi
          case "$NPM_REPO" in
            *://*|*/*)
              echo "::error::npm-registry-repo must be a bare repository name — no scheme, no path (got '$NPM_REPO')"
              exit 1 ;;
          esac

          # Empty port = scheme default; drop ':<port>' rather than emitting
          # a dangling 'http://host:/path'.
          if [ -n "$NEXUS_PORT" ]; then
            case "$NEXUS_PORT" in
              *[!0-9]*) echo "::error::NEXUS_PORT must be numeric (got '$NEXUS_PORT')"; exit 1 ;;
            esac
            authority="$NEXUS_HOST:$NEXUS_PORT"
          else
            authority="$NEXUS_HOST"
          fi

          # npm requires the trailing slash: the auth key below is matched against
          # the registry URL by prefix, and without it the two never line up.
          registry="http://$authority/repository/$NPM_REPO/"

          umask 077
          echo "registry=$registry" > "$RUNNER_TEMP/npmrc"

          if [ -n "$NEXUS_USER" ] && [ -n "$NEXUS_PASS" ]; then
            auth=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASS" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            # The auth key is the registry URL with the scheme stripped.
            printf '//%s/repository/%s/:_auth=%s\n' "$authority" "$NPM_REPO" "$auth" \
              >> "$RUNNER_TEMP/npmrc"
            echo "npm registry: $registry (authenticated as '$NEXUS_USER')"
          else
            echo "npm registry: $registry (anonymous — NEXUS_USERNAME/NEXUS_PASSWORD not both set)"
          fi

          chmod 600 "$RUNNER_TEMP/npmrc"

      - name: Build and push
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: ${{ inputs.build-args }}
          # Blank lines are dropped by the action's list parser, so each of these
          # collapses to nothing when its mount-* input is false.
          secret-files: |
            ${{ inputs.mount-pip-index && format('pip_index_url={0}/pip_index_url', runner.temp) || '' }}
            ${{ inputs.mount-pip-index && format('netrc={0}/netrc', runner.temp) || '' }}
            ${{ inputs.mount-npm-registry && format('npmrc={0}/npmrc', runner.temp) || '' }}
          tags: ${{ steps.meta_dev.outputs.tags || steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_dev.outputs.labels || steps.meta_release.outputs.labels }}

      # -----------------------------------------------------------------------
      # SBOM — generate a CycloneDX inventory of the pushed image (OS packages +
      # interpreter + installed wheels) and publish it to Dependency-Track.
      # Syft pulls the image by digest from the Nexus registry (already logged in
      # above). Language-agnostic: any caller passing generate-sbom gets this.
      # -----------------------------------------------------------------------
      - name: Generate image SBOM (Syft)
        id: sbom
        if: inputs.generate-sbom
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/syft-sbom@develop
        env:
          # Plain-HTTP pull from the Nexus connector. Reaches Syft: sbom-action@fc46e51 (node20) runs it with env = {...process.env} (src/github/SyftGithubAction.ts:111-112,175).
          SYFT_REGISTRY_INSECURE_USE_HTTP: ${{ inputs.insecure-registry && 'true' || 'false' }}
        with:
          image: ${{ env.NEXUS_DOCKER_REGISTRY }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-${{ inputs.image-name }}-image

      - name: Upload image SBOM to Dependency-Track
        if: inputs.generate-sbom
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/dependency-track-upload@develop
        with:
          bom-file: ${{ steps.sbom.outputs.bom-file }}
          project-name: ${{ inputs.sbom-project-name != '' && inputs.sbom-project-name || format('{0}-image', inputs.image-name) }}
          project-version: ${{ inputs.sbom-project-version }}
          server-url: ${{ inputs.secrets-source == 'openbao' && env.DEPENDENCYTRACK_URL || (inputs.secrets-source != 'openbao' && secrets.DEPENDENCYTRACK_URL || '') }}
          api-key: ${{ inputs.secrets-source == 'openbao' && env.DEPENDENCYTRACK_API_KEY || (inputs.secrets-source != 'openbao' && secrets.DEPENDENCYTRACK_API_KEY || '') }}

      # -----------------------------------------------------------------------
      # Vulnerability scan — Grype scans the pushed image against its CVE DB and
      # fails the build when something at or above `scan-severity-cutoff` is
      # found. Grype pulls the image by digest from the Nexus registry (already
      # logged in above) and catalogs it itself, so this is independent of the
      # SBOM feature above. Runs after the SBOM upload so the inventory is
      # recorded even when the gate trips. Language-agnostic.
      # -----------------------------------------------------------------------
      # The action keeps the SARIF report whether the scan passed or tripped the
      # gate, so a failing build still says which CVEs to fix.
      - name: Scan image for vulnerabilities (Grype)
        id: scan
        if: inputs.scan-image
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/grype-scan@develop
        env:
          # Plain-HTTP pull from the Nexus connector. Reaches Grype: scan-action@e116508 (node24) runs it with env = {...process.env} (action.js:305-306,429).
          GRYPE_REGISTRY_INSECURE_USE_HTTP: ${{ inputs.insecure-registry && 'true' || 'false' }}
        with:
          image: ${{ env.NEXUS_DOCKER_REGISTRY }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          fail-build: ${{ inputs.scan-fail-build }}
          severity-cutoff: ${{ inputs.scan-severity-cutoff }}
          output-format: sarif
          artifact-name: grype-${{ inputs.image-name }}-scan

      # -----------------------------------------------------------------------
      # Image hardening lint — Dockle checks the pushed image against the CIS
      # Docker Benchmark and best practices (non-root, no setuid/setgid, no
      # secrets/credentials baked into layers, cleared package caches, ...).
      # Complements Checkov (Dockerfile source) and Grype (CVEs) by inspecting
      # the actual image layers. Runs natively on the runner and pulls by digest
      # through the docker socket, reusing the Nexus login above. Language-agnostic.
      # -----------------------------------------------------------------------
      - name: Lint image hardening (Dockle)
        id: lint
        if: inputs.lint-image
        uses: erzz/dockle-action@e8a7c41f36f1236ca3282b298d425ffbfdb2e922 # v1.4.1
        env:
          # Dockle's env form of --insecure (--nonssl alone is not enough). Reaches Dockle: dockle-action@e8a7c41 is composite and runs `dockle` in a bash step (action.yml:56,88,90), no docker run; the action has no --insecure input.
          DOCKLE_INSECURE: ${{ inputs.insecure-registry && 'true' || 'false' }}
        with:
          image: ${{ env.NEXUS_DOCKER_REGISTRY }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          report-format: sarif
          report-name: dockle-report
          failure-threshold: ${{ inputs.lint-image-failure-threshold }}
          exit-code: ${{ inputs.lint-image-fail-build && '1' || '0' }}

      - name: Upload Dockle report (SARIF)
        if: ${{ !cancelled() && inputs.lint-image }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dockle-${{ inputs.image-name }}-report
          path: dockle-report.sarif
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Image signing — Cosign (key-based) signs every pushed reference by
      # digest, so consumers (or a Kubernetes admission controller) can verify
      # the image was built by this CI and has not been tampered with:
      #   cosign verify --key cosign.pub <registry>/<image>@<digest>
      # Gated to release builds; reuses the registry logins established above.
      # Needs the COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets. Language-agnostic.
      # -----------------------------------------------------------------------
      - name: Sign image (Cosign)
        if: ${{ inputs.sign-image && inputs.release }}
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/cosign-sign@develop
        with:
          images: ${{ steps.images.outputs.list }}
          digest: ${{ steps.build.outputs.digest }}
          private-key: ${{ inputs.secrets-source == 'openbao' && env.COSIGN_PRIVATE_KEY || (inputs.secrets-source != 'openbao' && secrets.COSIGN_PRIVATE_KEY || '') }}
          password: ${{ inputs.secrets-source == 'openbao' && env.COSIGN_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.COSIGN_PASSWORD || '') }}
          # Same plain-HTTP connector BuildKit just pushed to. Named explicitly
          # so only the Nexus reference is signed over HTTP; the GHCR and Docker
          # Hub references in the same list keep TLS.
          insecure-registries: ${{ inputs.insecure-registry && env.NEXUS_DOCKER_REGISTRY || '' }}
