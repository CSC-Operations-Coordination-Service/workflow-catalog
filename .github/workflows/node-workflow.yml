name: Node CI (reusable)

# Generic, project-agnostic Node.js CI workflow — the Node counterpart of the
# Python pipeline. Callers reference it with `uses:` and supply everything
# project-specific via inputs. Pass secrets with `secrets: inherit`.
#
# Pipeline: (optional Nexus registry setup) -> install -> lint -> build -> test
#           -> (optional npm SBOM -> Dependency-Track)
#           -> (optional Docker image via docker-build.yml).
#
# Secrets consumed (only when the matching feature is enabled; provided via
# `secrets: inherit` from the caller):
#   NEXUS_HOST / NEXUS_PORT / NEXUS_USERNAME / NEXUS_PASSWORD (use-nexus-registry)
#   DEPENDENCYTRACK_URL / DEPENDENCYTRACK_API_KEY   (generate-sbom)
#   NEXUS_DOCKER_REGISTRY_DEV / _PROD, NEXUS_USERNAME, NEXUS_PASSWORD,
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN             (build-image)
# or, with secrets-source: openbao, the same values from OpenBao only, never
# from these secrets (docs/openbao-secrets.md).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory containing package.json"
        required: true
        type: string
      node-version:
        description: "Node.js major version / image tag (e.g. '22')"
        required: false
        type: string
        default: "22"
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "self-hosted"

      # --- pipeline steps (each individually toggleable) ------------------
      use-nexus-registry:
        description: >
          Install from the organization's Nexus npm registry instead of
          registry.npmjs.org — the Node counterpart of what nexus-context does
          for pip, using the same NEXUS_* secrets. Covers both halves of the
          pipeline: the npm-context action configures the install below, and
          `mount-npm-registry` is forwarded to the image build so a Dockerfile
          running `npm ci` resolves through Nexus too.

          Required on runners without direct internet egress, and worth enabling
          anyway so what CI installs cannot drift from what the image installs.
        required: false
        type: boolean
        default: false
      npm-registry-repo:
        description: >
          Nexus repository serving npm packages when use-nexus-registry is true —
          a proxy of registry.npmjs.org, or a group that includes one.
        required: false
        type: string
        default: "npm-proxy"
      install-command:
        description: "Dependency install command"
        required: false
        type: string
        default: "npm ci"
      run-lint:
        required: false
        type: boolean
        default: true
      lint-command:
        required: false
        type: string
        default: "npm run lint"
      run-build:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: "npm run build"
      run-tests:
        required: false
        type: boolean
        default: false
      test-command:
        required: false
        type: string
        default: "npm test"
      build-env:
        description: "Newline-separated KEY=VALUE pairs exported before build/test (e.g. CI build defaults)"
        required: false
        type: string
        default: ""

      # --- SBOM (CycloneDX npm -> Dependency-Track) -----------------------
      generate-sbom:
        required: false
        type: boolean
        default: false
      sbom-project-name:
        description: "Dependency-Track project name (defaults to the package name)"
        required: false
        type: string
        default: ""
      sbom-project-version:
        description: "Dependency-Track project version (usually the release version)"
        required: false
        type: string
        default: ""

      # --- Docker image (delegates to the reusable docker-build.yml) ------
      build-image:
        required: false
        type: boolean
        default: false
      image-name:
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: ""
      docker-context:
        required: false
        type: string
        default: "."
      docker-build-args:
        required: false
        type: string
        default: ""
      docker-release:
        description: "true = semver + latest tags; false = branch + sha tags"
        required: false
        type: boolean
        default: false
      push-to-ghcr:
        required: false
        type: boolean
        default: false
      push-to-dockerhub:
        required: false
        type: boolean
        default: false
      docker-environment:
        description: "'dev' or 'prod' — selects which Nexus registry secrets docker-build.yml uses"
        required: false
        type: string
        default: "dev"
      sign-image:
        description: >
          Sign the pushed image digest with Cosign (key-based), forwarded to
          docker-build.yml. Release builds (docker-release) only. Needs the
          COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets or, with secrets-source:
          openbao, cosign in openbao-tools: the image build then reads the key
          alone, right before the signature, with the <openbao-role>-sign role
          (docs/openbao-secrets.md). In openbao mode it signs tag builds with
          docker-environment prod only; without cosign listed, on another build
          or with another environment, the job stops before the Node build.
        required: false
        type: boolean
        default: false

      # --- secrets source -------------------------------------------------
      secrets-source:
        description: >
          Where the Nexus, Docker Hub, Dependency-Track and Cosign values come
          from. `github` (default): the repository/organization secrets, as
          before. `openbao`: read them from OpenBao with the job's OIDC token
          (JWT auth), in any repository, public or private, that has a JWT role
          there. Then OpenBao is the only source: a value it does not give is
          empty, never taken from secrets.* (even with `secrets: inherit`).
          `openbao` needs `permissions: id-token: write` on the calling job, and
          the containerized runner pool (runs-on: containerized).
          Any other value stops the job.
        required: false
        type: string
        default: github
      openbao-url:
        description: "OpenBao API URL (secrets-source: openbao)"
        required: false
        type: string
        default: "https://openbao:8200"
      openbao-role:
        description: "OpenBao JWT role of this repository, ci-<repo> (secrets-source: openbao)"
        required: false
        type: string
        default: ""
      openbao-tools:
        description: >
          Tools whose values come from the devsecops layout
          (devsecops/ci/<dev|prod>/<tool>) instead of ocs/ci/shared, separated by
          single spaces on one line, e.g. "nexus dependency-track"; an unknown
          name or any other separator stops the job. A tool not listed keeps the
          ocs layout. Tag builds read prod and log in as <openbao-role>-release.
          cosign (the image build only, read alone as <openbao-role>-sign) is
          required with sign-image on a docker-release build. Only with
          secrets-source: openbao.
        required: false
        type: string
        default: ""

jobs:
  node-ci:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: node:${{ inputs.node-version }}
      # Only in openbao mode: the job container is a sibling on the host daemon and
      # has to join the overlay to reach https://openbao:8200. Docker (>= 25) takes
      # a second --network next to the one the runner adds.
      options: ${{ inputs.secrets-source == 'openbao' && '--network ocs_openbao' || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: ${{ github.workspace }}

      - name: Cache npm
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.npm
          key: npm-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ inputs.working-directory }}-

      # Runs before any OpenBao read, in every mode, under sh: a job container
      # can be an Alpine image (node:<v>-alpine, python:<v>-alpine), without bash.
      # secrets-source: every read tests == 'openbao', so any other value (a
      # typo such as open-bao) would quietly read the GitHub secrets instead.
      # openbao-tools is matched below with contains(' <tool> '), which takes a
      # misspelled tool, or a list split by newlines, tabs or commas, for no
      # tool at all: the read would quietly keep the ocs layout, out of reach of
      # the action's own check for unknown tools. Refuse both here.
      # And an image build that would sign in openbao mode without cosign in
      # openbao-tools, on a build that is not a tag, or with a
      # docker-environment other than prod: docker-build.yml refuses all three
      # too, but only after this job has run (and uploaded its SBOM). Same
      # rules, checked here first.
      - name: Check secrets-source and openbao-tools
        shell: sh
        env:
          SECRETS_SOURCE: ${{ inputs.secrets-source }}
          OPENBAO_TOOLS: ${{ inputs.openbao-tools }}
          SIGN_IMAGE: ${{ inputs.build-image && inputs.sign-image }}
          RELEASE: ${{ inputs.docker-release }}
          REF_TYPE: ${{ github.ref_type }}
          ENVIRONMENT: ${{ inputs.docker-environment }}
        run: |
          set -eu
          set -f
          known="nexus sonarqube dependency-track dockerhub cosign"
          # $1 on one line, for a message: newline, tab and CR spelled \n, \t, \r.
          # printf, not echo: dash's echo would turn a \n back into a newline.
          shown() { printf '%s\n' "$1" | awk '{ gsub(/\t/, "\\t"); gsub(/\r/, "\\r"); s = s sep $0; sep = "\\n" } END { printf "%s", s }'; }
          case $SECRETS_SOURCE in
            github | openbao) ;;
            *)
              printf "::error::secrets-source must be 'github' (the default) or 'openbao', got '%s'.\n" "$(shown "$SECRETS_SOURCE")"
              exit 1 ;;
          esac
          if [ "$SECRETS_SOURCE" != openbao ]; then
            echo "secrets-source: $SECRETS_SOURCE"
            exit 0
          fi
          # One line, one space between names: the only form the matchers see.
          # The letters are spelled out: in some locales a-z takes in capitals.
          # An empty list passes both checks.
          case $OPENBAO_TOOLS in
            ' '* | *' ' | *'  '* | *[!abcdefghijklmnopqrstuvwxyz\ -]*)
              printf "::error::openbao-tools must be tool names separated by single spaces on one line, e.g. \"nexus sonarqube\" (got '%s'). Known: %s.\n" "$(shown "$OPENBAO_TOOLS")" "$known"
              exit 1 ;;
          esac
          for t in $OPENBAO_TOOLS; do
            case " $known " in
              *" $t "*) ;;
              *) printf "::error::Unknown tool '%s' in openbao-tools. Known: %s.\n" "$t" "$known"; exit 1 ;;
            esac
          done
          # Signing in openbao mode reads the key from the devsecops layout only,
          # alone, with the <openbao-role>-sign role, right before the signing
          # step: the ocs/ci/shared layout never serves it, the role is bound to
          # tag builds, and the action refuses a tag build whose environment is
          # not prod (a tag build reads prod values only). All three refused
          # here, before anything is built, not at the signing step with the
          # image already pushed: with nexus not in openbao-tools, the Cosign
          # read is the first read that checks the environment. SIGN_IMAGE,
          # RELEASE, REF_TYPE and ENVIRONMENT are set where an image is signed
          # (docker-build.yml, and node-workflow.yml for its image build), unset
          # elsewhere.
          if [ "${SIGN_IMAGE:-false}" = true ] && [ "${RELEASE:-false}" = true ]; then
            case " $OPENBAO_TOOLS " in
              *" cosign "*) ;;
              *)
                printf "::error::sign-image on a release build in openbao mode needs cosign in openbao-tools (got '%s'). Signing in openbao mode reads the key with the <openbao-role>-sign role, from the devsecops layout only, right before the signing step; ocs/ci/shared does not serve it. Add cosign to openbao-tools.\n" "$OPENBAO_TOOLS"
                exit 1 ;;
            esac
            if [ "${REF_TYPE:-}" != tag ]; then
              printf "::error::sign-image on a release build in openbao mode signs tag builds only, and this is a '%s' build: the <openbao-role>-sign role that reads the key is bound to tag builds. Push a version tag, or turn off sign-image or release for this build.\n" "${REF_TYPE:-}"
              exit 1
            fi
            if [ "${ENVIRONMENT:-}" != prod ]; then
              printf "::error::sign-image on a release build in openbao mode needs the image build's environment to be prod (got '%s'): it signs tag builds only, a tag build reads prod values only, and the Cosign read, right before the signature, would refuse any other environment after the image is pushed. Set environment: prod (docker-environment: prod for node-workflow.yml).\n" "$(shown "${ENVIRONMENT:-}")"
              exit 1
            fi
          fi
          echo "secrets-source: openbao, openbao-tools: ${OPENBAO_TOOLS:-none}"

      # Exactly one of tools / shared is set: the devsecops layout when the
      # caller lists the tool in openbao-tools, the ocs/ci/shared names otherwise.
      - name: Read secrets from OpenBao
        if: inputs.secrets-source == 'openbao' && inputs.use-nexus-registry
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/openbao-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'nexus' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'NEXUS_HOST NEXUS_PORT NEXUS_USERNAME NEXUS_PASSWORD' || '' }}

      # Writes ~/.npmrc and exports NPM_CONFIG_USERCONFIG, so every npm step
      # below resolves through Nexus. Before the install, and after the cache
      # restore — the cache holds tarballs, not registry configuration.
      - name: Set up Nexus npm registry
        if: inputs.use-nexus-registry
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/npm-context@develop
        with:
          registry-repo: ${{ inputs.npm-registry-repo }}
          nexus-host: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_HOST || (inputs.secrets-source != 'openbao' && secrets.NEXUS_HOST || '') }}
          nexus-port: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PORT || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PORT || '') }}
          nexus-username: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          nexus-password: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Export build env
        if: inputs.build-env != ''
        # Two things this step got wrong before, both silent until they were not:
        #
        # 1. `[ -n "$line" ] && echo ...` made the failed test the exit status of
        #    the last loop iteration, hence of the pipeline. A block scalar ends
        #    with a newline and printf adds another, so the final iteration always
        #    read an empty line and the step failed with exit 1 under
        #    `bash -eo pipefail` — after correctly writing every variable. Any
        #    non-empty build-env tripped it, which made the input unusable.
        # 2. Interpolating the input into the script body let a value containing
        #    a quote or a backtick break the script. It arrives as an env var now,
        #    so the shell never parses it as code.
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          printf '%s\n' "$BUILD_ENV" | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "$line" >> "$GITHUB_ENV"
            fi
          done
        working-directory: ${{ github.workspace }}

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.lint-command }}

      - name: Build
        if: inputs.run-build
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.run-tests
        run: ${{ inputs.test-command }}

      # --- SBOM: CycloneDX npm inventory -> Dependency-Track --------------
      - name: Generate CycloneDX SBOM
        if: inputs.generate-sbom
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format json --output-file sbom-npm.cdx.json

      - name: Upload SBOM artifact
        if: inputs.generate-sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ inputs.image-name != '' && inputs.image-name || 'node' }}-package
          path: ${{ inputs.working-directory }}/sbom-npm.cdx.json
          if-no-files-found: error

      # The upload to Dependency-Track deliberately does NOT happen here — see
      # the `sbom-publish` job below.

      # This job container runs as root, so the bind-mounted workspace it leaves
      # behind (including .git/) is owned by uid 0. On a self-hosted runner the
      # next job of the run reuses that same directory, and any job without
      # `container:` runs as the unprivileged runner user — its checkout then
      # fails with "EACCES: permission denied, unlink '.git/FETCH_HEAD'". Hand
      # ownership back; $RUNNER_TEMP carries the host uid/gid through the mount.
      - name: Return workspace ownership to the runner user
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP")
          if chown -R "$owner" "$GITHUB_WORKSPACE"; then
            echo "workspace handed back to uid:gid $owner"
          else
            echo "::warning::could not fully chown $GITHUB_WORKSPACE to $owner — a later non-container job may fail to check out"
          fi

  # ---------------------------------------------------------------------------
  # Publish the npm SBOM from the runner host, deliberately without
  # `container:`. Dependency-Track is an internal service; from inside a job
  # container — own resolver, no route to a host-published port — the upload
  # fails as `curl: (7) Failed to connect to *** port <port> after 1 ms`. Same
  # reasoning as the `publish` job in sbom.yml. Takes the SBOM from the artifact
  # the job above uploaded, so no checkout is needed here (which is why the
  # composite action must stay referenced as owner/repo/path@ref).
  # ---------------------------------------------------------------------------
  sbom-publish:
    needs: node-ci
    if: inputs.generate-sbom
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sbom-${{ inputs.image-name != '' && inputs.image-name || 'node' }}-package
          path: sbom

      - name: Read secrets from OpenBao
        if: inputs.secrets-source == 'openbao'
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/openbao-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' dependency-track ') && 'dependency-track' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' dependency-track ') && 'DEPENDENCYTRACK_URL DEPENDENCYTRACK_API_KEY' || '' }}

      - name: Upload SBOM to Dependency-Track
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/dependency-track-upload@develop
        with:
          bom-file: sbom/sbom-npm.cdx.json
          project-name: ${{ inputs.sbom-project-name != '' && inputs.sbom-project-name || inputs.image-name }}
          project-version: ${{ inputs.sbom-project-version }}
          server-url: ${{ inputs.secrets-source == 'openbao' && env.DEPENDENCYTRACK_URL || (inputs.secrets-source != 'openbao' && secrets.DEPENDENCYTRACK_URL || '') }}
          api-key: ${{ inputs.secrets-source == 'openbao' && env.DEPENDENCYTRACK_API_KEY || (inputs.secrets-source != 'openbao' && secrets.DEPENDENCYTRACK_API_KEY || '') }}

  # ---------------------------------------------------------------------------
  # Optional image build — reuses the language-agnostic docker-build.yml.
  # ---------------------------------------------------------------------------
  docker:
    needs: node-ci
    if: inputs.build-image
    # No `permissions:` block on purpose: the job takes what the caller grants.
    # A block here would have to name `id-token: write` for the openbao mode,
    # and a nested job that asks for more than its caller grants fails the whole
    # run at startup -- for every caller, openbao or not. Callers already grant
    # contents: read and packages: write for this job.
    # TEMPORARY, with the openbao-secrets action refs: the new inputs only exist on
    # this branch (ci/openbao-secrets). All of them go back to @develop when the
    # branch is merged: scripts/pin-catalog-refs.sh develop (docs/releasing.md).
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/docker-build.yml@ci/openbao-secrets
    with:
      image-name: ${{ inputs.image-name }}
      context: ${{ inputs.docker-context }}
      dockerfile: ${{ inputs.dockerfile }}
      build-args: ${{ inputs.docker-build-args }}
      release: ${{ inputs.docker-release }}
      push-to-ghcr: ${{ inputs.push-to-ghcr }}
      push-to-dockerhub: ${{ inputs.push-to-dockerhub }}
      environment: ${{ inputs.docker-environment }}
      # Same toggle drives both halves: an image that runs `npm ci` needs the
      # registry as much as the job above does.
      mount-npm-registry: ${{ inputs.use-nexus-registry }}
      npm-registry-repo: ${{ inputs.npm-registry-repo }}
      generate-sbom: ${{ inputs.generate-sbom }}
      sbom-project-name: ${{ inputs.image-name != '' && format('{0}-image', inputs.image-name) || '' }}
      sbom-project-version: ${{ inputs.sbom-project-version }}
      sign-image: ${{ inputs.sign-image }}
      runs-on: ${{ inputs.runs-on }}
      secrets-source: ${{ inputs.secrets-source }}
      openbao-url: ${{ inputs.openbao-url }}
      openbao-role: ${{ inputs.openbao-role }}
      openbao-tools: ${{ inputs.openbao-tools }}
    secrets: inherit
