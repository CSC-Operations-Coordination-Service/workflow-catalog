name: Gitleaks secret scan

# Secret scanning with Gitleaks — catches committed credentials before they
# reach a released image or package ("shift-left" security).
#
# Dual-purpose, on purpose:
#   * workflow_call  → reusable primitive; other repos call it with `uses:` and
#                      pass `secrets: inherit` (mirrors the rest of the catalog).
#   * push / pull_request → guards THIS repo directly, so the catalog dogfoods
#                      its own scanner (no separate caller needed).
#
# Runner: defaults to `ubuntu-latest`, unlike the rest of the catalog. Gitleaks
#   needs nothing from the internal network — no Nexus, no proxy config, no
#   internal registry — only the repo checkout and the gitleaks binary, which the
#   action pulls from GitHub releases. A GitHub-hosted runner guarantees that
#   egress and keeps the self-hosted pool free for builds that actually need it.
#   Override with the `runs-on` input if a caller must keep source off hosted
#   runners.
#
# Secrets consumed:
#   GITLEAKS_LICENSE — REQUIRED by gitleaks-action on *organization* repos
#                      (free for personal repos). Get a key at https://gitleaks.io
#                      and store it as an organization secret so every repo shares
#                      it. See .github/SECRETS.md.
#   GITHUB_TOKEN     — provided automatically by Actions.
#
# gitleaks-action reads the triggering event to scope the scan: the pushed commit
# range on `push` and the PR commits on `pull_request`. Local pre-commit scanning
# is available too — see .pre-commit-config.yaml and docs/security-scanning.md.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so every commit is scanned

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
