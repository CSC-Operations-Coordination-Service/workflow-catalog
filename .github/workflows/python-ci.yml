name: Python CI (reusable)

# Reusable test + build + publish pipeline for a Nexus-backed Python package.
#
# Flow: test (pytest) -> build (wheel/sdist, publish to Nexus), with sonarqube
# (SonarQube scan of the reports `test` produced) running alongside `build`.
# The Nexus context is chosen automatically: release tags (refs/tags/*) use the
# 'prod' repos, everything else uses 'dev'.
#
# Pass secrets with `secrets: inherit`. Consumes these repository secrets:
#   NEXUS_HOST, NEXUS_PORT           (rendered into ~/pip.conf and ~/.pypirc)
#   NEXUS_USERNAME, NEXUS_PASSWORD   (pip reads via ~/.netrc + twine publish)
#   SONAR_TOKEN, SONAR_HOST_URL      (SonarQube scan)
# or, with secrets-source: openbao, the same values from OpenBao only, never
# from these secrets (docs/openbao-secrets.md).
#
# Outputs:
#   version — the setuptools_scm version resolved for this ref.

on:
  workflow_call:
    inputs:
      project-dir:
        description: "Directory containing the package (tox.ini, setup.cfg, ci/)"
        required: false
        type: string
        default: "python-demo"
      python-version:
        description: "Python version for the build/test containers"
        required: false
        type: string
        default: "3.11"
      publish:
        description: "Publish the built distribution to Nexus PyPI"
        required: false
        type: boolean
        default: true
      pretend-version:
        description: "setuptools_scm fallback version for the test job (no git history there)"
        required: false
        type: string
        default: "0.0.0"
      runs-on:
        description: "Runner label of every job (e.g. containerized for the container runner pool)"
        required: false
        type: string
        default: self-hosted

      # --- secrets source -------------------------------------------------
      secrets-source:
        description: >
          Where the Nexus and SonarQube values come from. `github` (default):
          the repository/organization secrets, as before. `openbao`: read them
          from OpenBao with the job's OIDC token (JWT auth), in any repository,
          public or private, that has a JWT role there. Then OpenBao is the
          only source: a value it does not give is empty, never taken from
          secrets.* (even with `secrets: inherit`). `openbao` needs
          `permissions: id-token: write` on the calling job, and the
          containerized runner pool (runs-on: containerized).
          Any other value stops the job.
        required: false
        type: string
        default: github
      openbao-url:
        description: "OpenBao API URL (secrets-source: openbao)"
        required: false
        type: string
        default: "https://openbao:8200"
      openbao-role:
        description: "OpenBao JWT role of this repository, ci-<repo> (secrets-source: openbao)"
        required: false
        type: string
        default: ""
      openbao-tools:
        description: >
          Tools whose values come from the devsecops layout
          (devsecops/ci/<dev|prod>/<tool>) instead of ocs/ci/shared, separated by
          single spaces on one line, e.g. "nexus sonarqube"; an unknown name or
          any other separator stops the job. A tool not listed keeps the ocs
          layout. Tag builds read prod and log in as <openbao-role>-release,
          which matches the Nexus context this workflow already picks (prod on
          refs/tags/*). Only with secrets-source: openbao.
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Resolved package version (setuptools_scm)"
        value: ${{ jobs.build.outputs.version }}

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: python:${{ inputs.python-version }}
      # In openbao mode the job container also joins the overlay, to reach
      # https://openbao:8200 (see node-workflow.yml `node-ci`).
      options: ${{ inputs.secrets-source == 'openbao' && '--add-host=host.docker.internal:host-gateway --network ocs_openbao' || '--add-host=host.docker.internal:host-gateway' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Runs before any OpenBao read, in every mode, under sh: a job container
      # can be an Alpine image (node:<v>-alpine, python:<v>-alpine), without bash.
      # secrets-source: every read tests == 'openbao', so any other value (a
      # typo such as open-bao) would quietly read the GitHub secrets instead.
      # openbao-tools is matched below with contains(' <tool> '), which takes a
      # misspelled tool, or a list split by newlines, tabs or commas, for no
      # tool at all: the read would quietly keep the ocs layout, out of reach of
      # the action's own check for unknown tools. Refuse both here.
      - name: Check secrets-source and openbao-tools
        shell: sh
        env:
          SECRETS_SOURCE: ${{ inputs.secrets-source }}
          OPENBAO_TOOLS: ${{ inputs.openbao-tools }}
        run: |
          set -eu
          set -f
          known="nexus sonarqube dependency-track dockerhub cosign"
          # $1 on one line, for a message: newline, tab and CR spelled \n, \t, \r.
          # printf, not echo: dash's echo would turn a \n back into a newline.
          shown() { printf '%s\n' "$1" | awk '{ gsub(/\t/, "\\t"); gsub(/\r/, "\\r"); s = s sep $0; sep = "\\n" } END { printf "%s", s }'; }
          case $SECRETS_SOURCE in
            github | openbao) ;;
            *)
              printf "::error::secrets-source must be 'github' (the default) or 'openbao', got '%s'.\n" "$(shown "$SECRETS_SOURCE")"
              exit 1 ;;
          esac
          if [ "$SECRETS_SOURCE" != openbao ]; then
            echo "secrets-source: $SECRETS_SOURCE"
            exit 0
          fi
          # One line, one space between names: the only form the matchers see.
          # The letters are spelled out: in some locales a-z takes in capitals.
          # An empty list passes both checks.
          case $OPENBAO_TOOLS in
            ' '* | *' ' | *'  '* | *[!abcdefghijklmnopqrstuvwxyz\ -]*)
              printf "::error::openbao-tools must be tool names separated by single spaces on one line, e.g. \"nexus sonarqube\" (got '%s'). Known: %s.\n" "$(shown "$OPENBAO_TOOLS")" "$known"
              exit 1 ;;
          esac
          for t in $OPENBAO_TOOLS; do
            case " $known " in
              *" $t "*) ;;
              *) printf "::error::Unknown tool '%s' in openbao-tools. Known: %s.\n" "$t" "$known"; exit 1 ;;
            esac
          done
          # Signing in openbao mode reads the key from the devsecops layout only,
          # alone, with the <openbao-role>-sign role, right before the signing
          # step: the ocs/ci/shared layout never serves it, the role is bound to
          # tag builds, and the action refuses a tag build whose environment is
          # not prod (a tag build reads prod values only). All three refused
          # here, before anything is built, not at the signing step with the
          # image already pushed: with nexus not in openbao-tools, the Cosign
          # read is the first read that checks the environment. SIGN_IMAGE,
          # RELEASE, REF_TYPE and ENVIRONMENT are set where an image is signed
          # (docker-build.yml, and node-workflow.yml for its image build), unset
          # elsewhere.
          if [ "${SIGN_IMAGE:-false}" = true ] && [ "${RELEASE:-false}" = true ]; then
            case " $OPENBAO_TOOLS " in
              *" cosign "*) ;;
              *)
                printf "::error::sign-image on a release build in openbao mode needs cosign in openbao-tools (got '%s'). Signing in openbao mode reads the key with the <openbao-role>-sign role, from the devsecops layout only, right before the signing step; ocs/ci/shared does not serve it. Add cosign to openbao-tools.\n" "$OPENBAO_TOOLS"
                exit 1 ;;
            esac
            if [ "${REF_TYPE:-}" != tag ]; then
              printf "::error::sign-image on a release build in openbao mode signs tag builds only, and this is a '%s' build: the <openbao-role>-sign role that reads the key is bound to tag builds. Push a version tag, or turn off sign-image or release for this build.\n" "${REF_TYPE:-}"
              exit 1
            fi
            if [ "${ENVIRONMENT:-}" != prod ]; then
              printf "::error::sign-image on a release build in openbao mode needs the image build's environment to be prod (got '%s'): it signs tag builds only, a tag build reads prod values only, and the Cosign read, right before the signature, would refuse any other environment after the image is pushed. Set environment: prod (docker-environment: prod for node-workflow.yml).\n" "$(shown "${ENVIRONMENT:-}")"
              exit 1
            fi
          fi
          echo "secrets-source: openbao, openbao-tools: ${OPENBAO_TOOLS:-none}"

      # Exactly one of tools / shared is set: the devsecops layout when the
      # caller lists the tool in openbao-tools, the ocs/ci/shared names otherwise.
      - name: Read Nexus secrets from OpenBao
        if: inputs.secrets-source == 'openbao'
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/openbao-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'nexus' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'NEXUS_HOST NEXUS_PORT NEXUS_USERNAME NEXUS_PASSWORD' || '' }}

      - name: Set up Nexus context
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/nexus-context@develop
        with:
          context: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
          nexus-host: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_HOST || (inputs.secrets-source != 'openbao' && secrets.NEXUS_HOST || '') }}
          nexus-port: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PORT || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PORT || '') }}
          nexus-username: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          nexus-password: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      - name: Install tox
        run: pip install tox

      - name: Run tests
        run: tox
        working-directory: ${{ inputs.project-dir }}
        env:
          # Unsuffixed on purpose. The *_FOR_<DIST> form is matched against the
          # dist name, so it silently stops applying for any caller whose
          # project-dir is not python-demo, and it is ignored outright wherever
          # the dist name is unknown (e.g. the `python -m setuptools_scm` CLI,
          # which does not read `name` from setup.cfg).
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.pretend-version }}

      # Hand the reports to the `sonarqube` job. tox writes them into the project
      # dir, which is where sonar-project.properties expects them
      # (sonar.python.coverage.reportPaths / sonar.python.xunit.reportPaths), so
      # the download in that job restores the same relative layout.
      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            ${{ inputs.project-dir }}/coverage.xml
            ${{ inputs.project-dir }}/pytest-report.xml
          if-no-files-found: error
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "2"

      # The job container runs as root and $GITHUB_WORKSPACE is bind-mounted in
      # from the host, so everything written above — including the .git/ that
      # checkout created — ends up owned by uid 0. On a self-hosted runner every
      # job of the run shares that one directory, so a later job with no
      # `container:` (docker-build.yml's `docker` job) executes as the
      # unprivileged runner user and its checkout dies cleaning the tree:
      # "EACCES: permission denied, unlink '.git/FETCH_HEAD'". Hand ownership
      # back. $RUNNER_TEMP is created by the runner on the host and bind mounts
      # preserve numeric ownership, so read the target uid:gid from it rather
      # than hardcoding the runner account.
      - name: Return workspace ownership to the runner user
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP")
          if chown -R "$owner" "$GITHUB_WORKSPACE"; then
            echo "workspace handed back to uid:gid $owner"
          else
            echo "::warning::could not fully chown $GITHUB_WORKSPACE to $owner — a later non-container job may fail to check out"
          fi

  # Static analysis, split out of `test` so a scanner or SonarQube-server problem
  # is distinguishable at a glance from a genuine test failure. Runs in parallel
  # with `build` — nothing downstream consumes its result, but a failure here
  # still fails the workflow.
  #
  # Kept in the same container image and with the same --add-host as `test`: if
  # SONAR_HOST_URL points at host.docker.internal, that alias exists only inside
  # the container and the scan would not resolve it from the host runner.
  sonarqube:
    needs: test
    runs-on: ${{ inputs.runs-on }}
    container:
      image: python:${{ inputs.python-version }}
      options: ${{ inputs.secrets-source == 'openbao' && '--add-host=host.docker.internal:host-gateway --network ocs_openbao' || '--add-host=host.docker.internal:host-gateway' }}

    steps:
      # In the ocs layout this reads ocs/ci/shared/SONAR_TOKEN and
      # ocs/ci/shared/SONAR_HOST_URL; with sonarqube in openbao-tools,
      # devsecops/ci/<dev|prod>/sonarqube instead. An operator stores them with
      # the platform repository's CI-secrets tool, dry run first (its default
      # layout for ocs, its devsecops layout for devsecops), or by hand with
      # bao kv put.
      # A missing path stops the job at this read, naming the paths.
      - name: Read SonarQube secrets from OpenBao
        if: inputs.secrets-source == 'openbao'
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/openbao-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' sonarqube ') && 'sonarqube' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' sonarqube ') && 'SONAR_TOKEN SONAR_HOST_URL' || '' }}

      # Preflight the SonarQube credentials before doing any work: the scan
      # action only *warns* when SONAR_TOKEN is empty, so a missing or stale
      # secret otherwise surfaces much later as a bare HTTP 401 from the
      # scanner bootstrap ("Failed to query server version").
      - name: Check SonarQube URL and token
        env:
          SONAR_TOKEN: ${{ inputs.secrets-source == 'openbao' && env.SONAR_TOKEN || (inputs.secrets-source != 'openbao' && secrets.SONAR_TOKEN || '') }}
          SONAR_HOST_URL: ${{ inputs.secrets-source == 'openbao' && env.SONAR_HOST_URL || (inputs.secrets-source != 'openbao' && secrets.SONAR_HOST_URL || '') }}
          # The OpenBao path each value comes from, for the messages below: in
          # openbao mode an empty value is a gap at exactly that path (nothing
          # falls back to secrets.*). Chosen like the read above, and the kind
          # like the action: prod on a tag build. Empty in github mode.
          SONAR_HOST_URL_AT: ${{ inputs.secrets-source == 'openbao' && (contains(format(' {0} ', inputs.openbao-tools), ' sonarqube ') && format('devsecops/ci/{0}/sonarqube (field url)', github.ref_type == 'tag' && 'prod' || 'dev') || 'ocs/ci/shared/SONAR_HOST_URL (key value)') || '' }}
          SONAR_TOKEN_AT: ${{ inputs.secrets-source == 'openbao' && (contains(format(' {0} ', inputs.openbao-tools), ' sonarqube ') && format('devsecops/ci/{0}/sonarqube (field token)', github.ref_type == 'tag' && 'prod' || 'dev') || 'ocs/ci/shared/SONAR_TOKEN (key value)') || '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # empty NAME OPENBAO_PATH: stop on an empty value, naming where it was
          # due to come from.
          empty() {
            case "$2" in
              '') fail "$1 is empty. Add it as a repository or organization secret; for an org secret, check that this repo is in its access list. With secrets-source: openbao it comes from OpenBao (docs/openbao-secrets.md)." ;;
              ocs/*) fail "$1 is empty: OpenBao has no value at $2. An operator stores it there, or the caller lists sonarqube in openbao-tools to read devsecops/ci/<dev|prod>/sonarqube instead (docs/openbao-secrets.md). In openbao mode the repository's secrets are not read." ;;
              *) fail "$1 is empty: OpenBao has no value at $2. An operator stores it there (docs/openbao-secrets.md). In openbao mode the repository's secrets are not read." ;;
            esac
          }

          [ -n "$SONAR_HOST_URL" ] || empty SONAR_HOST_URL "$SONAR_HOST_URL_AT"
          [ -n "$SONAR_TOKEN" ] || empty SONAR_TOKEN "$SONAR_TOKEN_AT"

          case "$SONAR_HOST_URL" in
            http://*|https://*) ;;
            *) fail "SONAR_HOST_URL must start with http:// or https://" ;;
          esac
          case "$SONAR_HOST_URL" in
            */) fail "SONAR_HOST_URL must not end with a slash — the scanner appends /api/... to it." ;;
          esac

          # Safe to print: a length and a truncated hash reveal nothing usable,
          # but let you compare against the token you meant to store:
          #   printf '%s' "$SONAR_TOKEN" | sha256sum | cut -c1-12
          # A SonarQube token is 44 chars (sqa_/sqp_/squ_ + 40); more means
          # stray whitespace crept into the secret.
          echo "SONAR_TOKEN length: ${#SONAR_TOKEN}, sha256: $(printf '%s' "$SONAR_TOKEN" | sha256sum | cut -c1-12)"

          # Identifies which SonarQube answered, without echoing the URL secret.
          echo "server: $(curl -sS -m 20 "$SONAR_HOST_URL/api/system/status" || echo unreachable)"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/v2/analysis/version" || true)

          case "${code:-000}" in
            200) echo "SonarQube reachable, token accepted." ;;
            401|403) fail "SonarQube rejected the token (HTTP $code). It is expired, revoked, or left over from a previous server — regenerate it and update the secret." ;;
            000) fail "Cannot reach $SONAR_HOST_URL from the runner (DNS, routing or proxy)." ;;
            *) fail "Unexpected HTTP $code from SonarQube — expected 200." ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # sonar.scm.provider=git needs history to attribute lines; a shallow
          # clone leaves blame data empty and new-code detection unreliable.
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download test reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: test-reports
          path: ${{ inputs.project-dir }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ inputs.secrets-source == 'openbao' && env.SONAR_TOKEN || (inputs.secrets-source != 'openbao' && secrets.SONAR_TOKEN || '') }}
          SONAR_HOST_URL: ${{ inputs.secrets-source == 'openbao' && env.SONAR_HOST_URL || (inputs.secrets-source != 'openbao' && secrets.SONAR_HOST_URL || '') }}

      # See the identical step in `test`: this container runs as root, and the
      # root-owned workspace it would leave behind breaks the checkout of the next
      # non-container job on the same self-hosted runner.
      - name: Return workspace ownership to the runner user
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP")
          if chown -R "$owner" "$GITHUB_WORKSPACE"; then
            echo "workspace handed back to uid:gid $owner"
          else
            echo "::warning::could not fully chown $GITHUB_WORKSPACE to $owner — a later non-container job may fail to check out"
          fi

  build:
    needs: test
    runs-on: ${{ inputs.runs-on }}
    container:
      image: python:${{ inputs.python-version }}
      options: ${{ inputs.secrets-source == 'openbao' && '--network ocs_openbao' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history + tags so setuptools_scm computes the real version

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Exactly one of tools / shared is set: the devsecops layout when the
      # caller lists the tool in openbao-tools, the ocs/ci/shared names otherwise.
      - name: Read Nexus secrets from OpenBao
        if: inputs.secrets-source == 'openbao'
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/openbao-secrets@ci/openbao-secrets
        with:
          openbao-url: ${{ inputs.openbao-url }}
          role: ${{ inputs.openbao-role }}
          tools: ${{ contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'nexus' || '' }}
          shared: ${{ !contains(format(' {0} ', inputs.openbao-tools), ' nexus ') && 'NEXUS_HOST NEXUS_PORT NEXUS_USERNAME NEXUS_PASSWORD' || '' }}

      - name: Set up Nexus context
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/nexus-context@develop
        with:
          context: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
          nexus-host: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_HOST || (inputs.secrets-source != 'openbao' && secrets.NEXUS_HOST || '') }}
          nexus-port: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PORT || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PORT || '') }}
          nexus-username: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          nexus-password: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      - name: Install tox
        run: pip install tox setuptools_scm

      # setuptools_scm derives the version from git metadata, so an unusable work
      # tree otherwise surfaces as a bare "unable to detect version" LookupError
      # out of a PEP 517 backend two steps later. Check it where the cause is
      # still visible.
      - name: Check git metadata for setuptools_scm
        working-directory: ${{ inputs.project-dir }}
        env:
          PYTHON_IMAGE_TAG: ${{ inputs.python-version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          command -v git >/dev/null 2>&1 || fail "git is missing from the python:$PYTHON_IMAGE_TAG container. actions/checkout then falls back to a REST API tarball, which carries no .git, and setuptools_scm cannot resolve a version from it."

          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || fail "$PWD is not part of a usable git work tree: $(git status 2>&1 | tr '\n' ' ')"

          # Note: the toplevel is the repository root, not this directory —
          # python-demo/ has no .git of its own, which is why the package sets
          # search_parent_directories in [tool.setuptools_scm].
          echo "toplevel: $(git rev-parse --show-toplevel)"
          echo "HEAD:     $(git rev-parse --short HEAD)"
          echo "tags:     $(git tag --list | wc -l)"
          echo "describe: $(git describe --tags --always --dirty 2>&1)"

      - name: Resolve version
        id: version
        working-directory: ${{ inputs.project-dir }}
        run: |
          set -euo pipefail

          # Deliberately not `echo "version=$(python -m setuptools_scm)"`: the
          # exit status of a command substitution inside echo is discarded, so
          # that form kept this step green when setuptools_scm failed and
          # exported an empty version — breaking the build step below and every
          # consumer of the `version` output.
          version=$(python -m setuptools_scm)
          [ -n "$version" ] || { echo "::error::setuptools_scm resolved an empty version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Build distribution
        run: tox -e build
        working-directory: ${{ inputs.project-dir }}
        env:
          # The PEP 517 backend runs in build's own isolated venv; hand it the
          # version resolved above rather than making it re-derive one, so the
          # artifact version and the `version` output cannot diverge.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ inputs.project-dir }}/dist/
          if-no-files-found: error
        env:
          # A dist is two small files, so parallel block uploads buy nothing
          # here, while every extra simultaneous TLS connection to Azure is
          # another chance for a corporate firewall to reset the batch.
          # This knob requires @actions/artifact >= 2.2.1, i.e. upload-artifact
          # >= v4.6.0 — it is silently ignored on older pins, so it must be
          # kept in step with the SHA above.
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "2"

      - name: Publish to Nexus
        if: inputs.publish
        # tox publishes to the server named in TWINE_REPOSITORY (set by
        # nexus-context to nexus-dev / nexus-prod), resolved against ~/.pypirc.
        # Credentials come from the env vars below, not the committed file.
        run: tox -e publish
        working-directory: ${{ inputs.project-dir }}
        env:
          TWINE_USERNAME: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_USERNAME || (inputs.secrets-source != 'openbao' && secrets.NEXUS_USERNAME || '') }}
          TWINE_PASSWORD: ${{ inputs.secrets-source == 'openbao' && env.NEXUS_PASSWORD || (inputs.secrets-source != 'openbao' && secrets.NEXUS_PASSWORD || '') }}

      # See the identical step in `test` above: the root-owned workspace this
      # container leaves behind would break the checkout of the next
      # non-container job on the same self-hosted runner.
      - name: Return workspace ownership to the runner user
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP")
          if chown -R "$owner" "$GITHUB_WORKSPACE"; then
            echo "workspace handed back to uid:gid $owner"
          else
            echo "::warning::could not fully chown $GITHUB_WORKSPACE to $owner — a later non-container job may fail to check out"
          fi
