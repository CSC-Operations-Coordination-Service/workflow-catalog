name: Docker Security Pipeline

on:
  push:
    branches: ["main", "docker-security-pipeline"]
  pull_request:
    branches: ["main", "docker-security-pipeline"]

env:
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_LOCAL: workflow-catalog:${{ github.sha }}

jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Checkov
      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
          output_format: cli

      # 2. Build
      - name: Build image
        run: docker build -t ${{ env.IMAGE_LOCAL }} .

      # 3. Generate SBOM
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: syft docker:${{ env.IMAGE_LOCAL }} -o spdx-json=sbom.spdx.json

      # 4. Store SBOM
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      # 5. Grype scan
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v6
        with:
          sbom: "sbom.spdx.json"
          fail-build: true
          severity-cutoff: "high"

      # 6. Push to GitHub Repo (only on main or docker-security-pipeline, only if all above passed)
      # 6a. Convert the repository path to lowercase and store it in env.IMAGE
      - name: Set up Image Name
        run: |
          export IMAGE_REPO_NAME=$(echo "${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          export STAGING_IMAGE_REPO_NAME=$(echo "${{ github.repository }}:staging-latest" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO_NAME=$IMAGE_REPO_NAME" >> $GITHUB_ENV
          echo "STAGING_IMAGE_REPO_NAME=$STAGING_IMAGE_REPO_NAME" >> $GITHUB_ENV

      # 6b. Log in to GHCR (Ensure this step is right before you push)
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docker-security-pipeline')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6ci. Push image to GitHub repo if main using the safe, lowercase
      # environment variable
      - name: Push image (main branch)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
        run: |
          docker tag ${{ env.IMAGE_LOCAL }} "ghcr.io/${{ env.IMAGE_REPO_NAME }}"
          docker push "ghcr.io/${{ env.IMAGE_REPO_NAME }}"

      # 6cii. Push image to GitHub repo if this workflow's testing branch 
      # using the safe, lowercase environment variable (+ '-staging' to image 
      # name)
      - name: Push image (workflow test, docker-security-pipeline branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/docker-security-pipeline'
        run: |
          docker tag ${{ env.IMAGE_LOCAL }} "ghcr.io/${{ env.STAGING_IMAGE_REPO_NAME }}"
          docker push "ghcr.io/${{ env.STAGING_IMAGE_REPO_NAME }}"

      # 7. Push to Docker Hub (only on main, only if all above passed)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_LOCAL }} "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO_NAME }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO_NAME }}"
