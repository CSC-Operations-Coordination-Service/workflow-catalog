# 1. Verify the Dockerfile with Checkov
# 2. Build the dockerimage 
# 3. Scan the dockerimage using Syft
# 4. Store the SBOM as artifacts
# 5. Scan the SBOM using Grype
# 6. If the scan is “good” push it into the github repo (but ultimately, the dockerhub)
name: Docker Security Pipeline

on:
  push:
    branches: ["main", "docker-security-pipeline"]
  pull_request:
    branches: ["main", "docker-security-pipeline"]

env:
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. Lint & verify the Dockerfile with Checkov ─────────────────────────
  checkov-scan:
    name: Checkov — Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .          # scans the whole repo recursively
          framework: dockerfile
          # Fail the job if any HIGH/CRITICAL check fails.
          # Remove or adjust to soft-fail during initial onboarding:
          soft_fail: false
          output_format: cli,sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF report
        if: always()                        # upload even on failure for review
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov-dockerfile

