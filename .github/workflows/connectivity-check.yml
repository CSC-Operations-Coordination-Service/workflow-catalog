name: Check SonarQube connectivity

on:
    workflow_dispatch:
    push:
        branches:
            - "ci/*"

jobs:
    check-sonarqube:
        runs-on: self-hosted

        steps:
            - name: Debug network info
              run: |
                  echo "Hostname:"
                  hostname
                  echo "IP:"
                  hostname -I || ip a

            - name: Resolve SonarQube service
              run: |
                  echo "Resolving sonar service..."
                  getent hosts sonarqube || nslookup sonarqube || ping -c 2 sonarqube

            - name: Check connectivity with curl
              env:
                  SONAR_URL: http://sonarqube:9000
              run: |
                  echo "Checking SonarQube availability at $SONAR_URL"

                  curl -v --fail --connect-timeout 5 "$SONAR_URL/api/system/status" \
                  || (echo "❌ SonarQube unreachable" && exit 1)

            - name: Validate SonarQube status
              run: |
                  STATUS=$(curl -s http://sonarqube:9000/api/system/status | jq -r '.status')
                  echo "SonarQube status: $STATUS"

                  if [ "$STATUS" != "UP" ]; then
                    echo "❌ SonarQube is not UP"
                    exit 1
                  fi

                  echo "✅ SonarQube is reachable and UP"
