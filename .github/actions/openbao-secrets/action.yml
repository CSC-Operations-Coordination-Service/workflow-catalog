name: "OpenBao secrets"
description: >
  Log in to OpenBao with the job's GitHub OIDC token (JWT auth) and export
  secrets as environment variables for the rest of the job.

  Nothing is stored in the repository: GitHub signs a short-lived token for the
  job, and the OpenBao role named by `role` is bound to this repository, so a
  job can only read what its role's policies allow. The calling job needs
  `permissions: id-token: write`.

  Two layouts, chosen per call: `tools` set means the devsecops layout,
  otherwise the ocs layout. One call never mixes them (`tools` with `shared` is
  refused).

  ocs layout (kv-v2 mount `ocs`), one secret per name, value in the key `value`:
    shared  ->  ocs/ci/shared/<NAME>   (readable by every CI role)
    repo    ->  ocs/ci/<repository name>/<NAME>   (this repository's role only)
  and arrive as the environment variable <NAME>, masked in logs.

  devsecops layout (kv-v2 mount `devsecops`), one secret per tool, fields
  inside: devsecops/ci/<kind>/<tool>, where kind is `prod` on a tag build and
  `dev` on every other build. A tag build logs in as `<role>-release`, any
  other build as `<role>`: callers pass the base role name only. Each field is
  exported under the name the workflows already read (map in the step below),
  masked. Every field but nexus's `goproxy` is required: a secret that lacks
  one, or holds it empty, stops the job before anything is exported. `repo`
  names are read from the ocs layout with the same login.

  Runs on the containerized runner pool, where https://openbao:8200 resolves
  (the overlay `ocs_openbao`). A job with a `container:` is a sibling container
  and needs `options: --network ocs_openbao`; the reusable workflows add it.

inputs:
  openbao-url:
    description: "OpenBao API URL, e.g. https://openbao:8200"
    required: true
  role:
    description: >
      JWT role of this repository, e.g. ci-ocs-operator-app. With `tools`, the
      base name: tag builds log in as `<role>-release`.
    required: true
  shared:
    description: "Names under ocs/ci/shared, separated by spaces or newlines. Not with `tools`."
    required: false
    default: ""
  repo:
    description: "Names under ocs/ci/<this repository>, separated by spaces or newlines."
    required: false
    default: ""
  tools:
    description: >
      Tools to read from the devsecops layout, separated by spaces or newlines:
      nexus, sonarqube, dependency-track, dockerhub, cosign. Empty = the ocs
      layout (`shared` / `repo`), exactly as before.
    required: false
    default: ""
  environment:
    description: >
      Optional, with `tools` only: the caller's target environment (`dev` or
      `prod`). It must agree with the build kind: prod values are readable from
      tag builds only, and a tag build reads prod values only. A mismatch stops
      the job before the login.
    required: false
    default: ""
  audience:
    description: "Audience of the GitHub token; must equal the role's bound audience."
    required: false
    default: "https://openbao:8200"
  auth-path:
    description: "Mount path of the JWT auth method."
    required: false
    default: "jwt"

runs:
  using: composite
  steps:
    # --- ocs layout: ocs/ci/shared/<NAME>, ocs/ci/<repo>/<NAME> ----------------
    - name: Build the secret mapping
      id: map
      if: inputs.tools == ''
      shell: bash
      env:
        SHARED: ${{ inputs.shared }}
        REPO: ${{ inputs.repo }}
        REPO_NAME: ${{ github.event.repository.name }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Split on any whitespace, so a caller can pass the names on one line
        # (from an expression) or one per line (a block scalar). No globbing.
        set -f
        {
          echo "secrets<<EOF_MAP"
          for n in $SHARED; do echo "ocs/data/ci/shared/${n} value | ${n}"; done
          for n in $REPO; do echo "ocs/data/ci/${REPO_NAME}/${n} value | ${n}"; done
          echo "EOF_MAP"
          echo "ca=$(base64 -w0 "${ACTION_PATH}/openbao-ca.crt")"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to OpenBao and read the secrets
      id: login
      if: inputs.tools == ''
      # The failure is reported by the next step, with a message that says what
      # to look at; continue-on-error only defers the stop.
      continue-on-error: true
      uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
      with:
        url: ${{ inputs.openbao-url }}
        method: jwt
        path: ${{ inputs.auth-path }}
        role: ${{ inputs.role }}
        jwtGithubAudience: ${{ inputs.audience }}
        caCertificate: ${{ steps.map.outputs.ca }}
        secrets: ${{ steps.map.outputs.secrets }}
        exportEnv: true

    - name: Stop if OpenBao could not be read
      if: inputs.tools == '' && steps.login.outcome == 'failure'
      shell: bash
      env:
        SHARED: ${{ inputs.shared }}
        REPO: ${{ inputs.repo }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        echo "::error::OpenBao login or secret read failed at ${{ inputs.openbao-url }} (role ${{ inputs.role }})."
        echo "::error::Check, in order: is OpenBao SEALED (it is unsealed by hand after any restart)? Does this job have 'permissions: id-token: write'? Does the job's container join the ocs_openbao network? Does the role exist and is it bound to ${{ github.repository }}? Do the secret names exist under ocs/ci?"
        # The paths, never the values: one path that nothing writes (for
        # python-ci, ocs/ci/shared/SONAR_HOST_URL) fails the whole read, and
        # the list says where to look without opening the role's policies.
        set -f
        paths=""
        for n in $SHARED; do paths="$paths ocs/ci/shared/$n"; done
        for n in $REPO; do paths="$paths ocs/ci/$REPO_NAME/$n"; done
        if [ -n "$paths" ]; then
          echo "::error::This read needs each of these, with the key 'value':$paths. Any one missing fails it. 'bao kv metadata get -mount=ocs ci/shared/<NAME>' shows whether one exists, without its value."
        fi
        exit 1

    # --- devsecops layout: devsecops/ci/<dev|prod>/<tool> ----------------------
    # Not vault-action: it fails on any selector that finds nothing, so a field
    # an operator did not store (goproxy, say) would stop every build, and it
    # cannot rename one secret's fields per tool. A script does the login and the
    # reads itself, with Node's https and the bundled CA: the token never leaves
    # this step, and every value is masked before it is exported.
    - name: Log in to OpenBao and read the devsecops secrets
      if: inputs.tools != ''
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        OPENBAO_URL: ${{ inputs.openbao-url }}
        OPENBAO_ROLE: ${{ inputs.role }}
        OPENBAO_AUDIENCE: ${{ inputs.audience }}
        OPENBAO_AUTH_PATH: ${{ inputs.auth-path }}
        OPENBAO_TOOLS: ${{ inputs.tools }}
        OPENBAO_SHARED: ${{ inputs.shared }}
        OPENBAO_REPO: ${{ inputs.repo }}
        OPENBAO_ENVIRONMENT: ${{ inputs.environment }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        REPOSITORY: ${{ github.repository }}
        REPO_NAME: ${{ github.event.repository.name }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const fs = require('fs');
          const https = require('https');
          const path = require('path');
          const env = process.env;
          const words = (s) => [...new Set((s || '').split(/\s+/).filter(Boolean))];

          // Build kind: a version tag publishes prod artifacts, anything else dev.
          const kind = env.REF_TYPE === 'tag' ? 'prod' : 'dev';
          const role = kind === 'prod' ? `${env.OPENBAO_ROLE}-release` : env.OPENBAO_ROLE;

          // The contract with csc-ocs-ansible: field of
          // devsecops/ci/<kind>/<tool> -> variable the workflows read.
          // csc-ocs-ansible's scripts/ci-secrets does not write this layout yet:
          // an operator writes each secret by hand with
          // `bao kv put -mount=devsecops ci/<dev|prod>/<tool> ...`. When that
          // script learns the layout, change it and this map together.
          const MAP = {
            nexus: {
              host: 'NEXUS_HOST', port: 'NEXUS_PORT',
              username: 'NEXUS_USERNAME', password: 'NEXUS_PASSWORD',
              docker_registry: kind === 'prod' ? 'NEXUS_DOCKER_REGISTRY_PROD' : 'NEXUS_DOCKER_REGISTRY_DEV',
              goproxy: 'GOPROXY',
            },
            sonarqube: { url: 'SONAR_HOST_URL', token: 'SONAR_TOKEN' },
            'dependency-track': { url: 'DEPENDENCYTRACK_URL', api_key: 'DEPENDENCYTRACK_API_KEY' },
            dockerhub: { username: 'DOCKERHUB_USERNAME', token: 'DOCKERHUB_TOKEN' },
            cosign: { private_key: 'COSIGN_PRIVATE_KEY', password: 'COSIGN_PASSWORD' },
          };
          // Fields a tool's secret must carry, non-empty. The workflows have no
          // other source for them in openbao mode (they never fall back to
          // secrets.*), so a gap here would surface later as an empty login or
          // URL, far from its cause. goproxy is the one optional field: only Go
          // builds use it.
          const REQUIRED = {
            nexus: ['host', 'port', 'username', 'password', 'docker_registry'],
            sonarqube: ['url', 'token'],
            'dependency-track': ['url', 'api_key'],
            dockerhub: ['username', 'token'],
            cosign: ['private_key', 'password'],
          };
          // A number is fine (an operator may store port=8082 as JSON); blank,
          // a boolean, an object or null is not a value a workflow can use.
          const usable = (v) => (typeof v === 'number' && Number.isFinite(v)) || (typeof v === 'string' && v.trim() !== '');
          // How an operator fixes a missing secret or field. Values go in on
          // stdin (`field=-`, typed or piped, one per command) or from a file
          // (`field=@path`), never as an argument, where the shell history and
          // the process list would keep them.
          const HOWTO = (tool) => `An operator writes it by hand, until csc-ocs-ansible's scripts/ci-secrets supports this layout: bao kv put -mount=devsecops ci/${kind}/${tool} <field>=... (bao kv patch to add a field), each secret field as <field>=- (stdin) or <field>=@<file>, never as an argument. A pipeline never writes it.`;

          // --- refuse a bad request before talking to OpenBao. Object.hasOwn,
          // not `in`: 'constructor' is `in` every object.
          const tools = words(env.OPENBAO_TOOLS);
          const unknown = tools.filter((t) => !Object.hasOwn(MAP, t));
          if (unknown.length) {
            throw new Error(`Unknown tool(s) in 'tools': ${unknown.join(', ')}. Known: ${Object.keys(MAP).join(', ')}.`);
          }
          if (words(env.OPENBAO_SHARED).length) {
            throw new Error("Pass either 'tools' (devsecops layout) or 'shared' (ocs/ci/shared), not both in one call.");
          }
          const want = env.OPENBAO_ENVIRONMENT;
          if (want && !['dev', 'prod'].includes(want)) {
            throw new Error(`environment must be 'dev' or 'prod', got '${want}'.`);
          }
          if (want === 'prod' && kind !== 'prod') {
            throw new Error(`environment is 'prod' but this is a ${env.REF_TYPE} build of '${env.REF_NAME}': prod credentials are readable from tag builds only. Build with environment: dev, or push a version tag.`);
          }
          if (want === 'dev' && kind === 'prod') {
            throw new Error(`This is a tag build of '${env.REF_NAME}', which reads devsecops/ci/prod only, but environment is 'dev'. Set environment: prod for tag builds.`);
          }

          // --- HTTPS to OpenBao. Node's https ignores HTTPS_PROXY, which is what
          // we want: openbao:8200 is on the overlay, never behind squid.
          const base = env.OPENBAO_URL.replace(/\/+$/, '');
          const ca = fs.readFileSync(path.join(env.ACTION_PATH, 'openbao-ca.crt'), 'utf8');
          const call = (method, apiPath, { token, body } = {}) => new Promise((resolve, reject) => {
            const data = body === undefined ? undefined : JSON.stringify(body);
            const headers = { Accept: 'application/json' };
            if (token) headers['X-Vault-Token'] = token;
            if (data) { headers['Content-Type'] = 'application/json'; headers['Content-Length'] = Buffer.byteLength(data); }
            const req = https.request(new URL(`${base}/v1/${apiPath}`), { method, ca, headers, timeout: 20000 }, (res) => {
              let text = '';
              res.setEncoding('utf8');
              res.on('data', (c) => { text += c; });
              res.on('end', () => {
                let json = null;
                try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
                resolve({ status: res.statusCode, json });
              });
            });
            req.on('timeout', () => req.destroy(new Error('no answer within 20 s')));
            req.on('error', reject);
            if (data) req.write(data);
            req.end();
          });
          const why = (r) => (r.json && Array.isArray(r.json.errors) && r.json.errors.length ? r.json.errors.join('; ') : `HTTP ${r.status}`);
          const CHECKS = `Check, in order: is OpenBao SEALED (it is unsealed by hand after any restart)? Does this job have 'permissions: id-token: write'? Does the job's container join the ocs_openbao network? Does the role '${role}' exist, bound to ${env.REPOSITORY}${kind === 'prod' ? ' and to ref_type tag' : ''}?`;

          // --- login
          let jwt;
          try {
            jwt = await core.getIDToken(env.OPENBAO_AUDIENCE);
          } catch (e) {
            throw new Error(`Cannot get the job's GitHub OIDC token (${e.message}). The calling job needs 'permissions: id-token: write'.`);
          }
          let login;
          try {
            login = await call('POST', `auth/${env.OPENBAO_AUTH_PATH}/login`, { body: { role, jwt } });
          } catch (e) {
            throw new Error(`OpenBao at ${base} cannot be reached (${e.message}). ${CHECKS}`);
          }
          const token = login.json && login.json.auth && login.json.auth.client_token;
          if (login.status !== 200 || !token) {
            throw new Error(`OpenBao login as role '${role}' failed: ${why(login)}. ${CHECKS}`);
          }
          core.setSecret(token);

          // --- reads, all of them before the first export: a request that
          // fails part-way leaves no half set of variables behind.
          const read = async (apiPath, label, missing) => {
            let r;
            try {
              r = await call('GET', apiPath, { token });
            } catch (e) {
              throw new Error(`Reading ${label} from OpenBao failed (${e.message}). ${CHECKS}`);
            }
            if (r.status === 404) throw new Error(`${label} does not exist in OpenBao. ${missing}`);
            if (r.status === 403) throw new Error(`Role '${role}' may not read ${label} (${why(r)}). Its policies are in csc-ocs-ansible stacks/platform/openbao/openbao-config.yml.`);
            if (r.status !== 200 || !r.json || !r.json.data || !r.json.data.data) throw new Error(`Reading ${label} failed: ${why(r)}. ${CHECKS}`);
            return r.json.data.data;
          };

          const pending = [];   // { label, vars: [[name, value]], ignored: [field] }
          for (const tool of tools) {
            const label = `devsecops/ci/${kind}/${tool}`;
            const fields = await read(`devsecops/data/ci/${kind}/${tool}`, label, HOWTO(tool));
            // Names only in the message, never values.
            const lacking = REQUIRED[tool].filter((f) => !Object.hasOwn(fields, f) || !usable(fields[f]));
            if (lacking.length) {
              throw new Error(`${label} lacks required field(s): ${lacking.join(', ')} (absent, empty, or not a string or number). Nothing was exported. ${HOWTO(tool)}`);
            }
            const vars = [];
            const ignored = [];
            for (const [field, value] of Object.entries(fields)) {
              if (!Object.hasOwn(MAP[tool], field) || !usable(value)) { ignored.push(field); continue; }
              vars.push([MAP[tool][field], String(value)]);
            }
            pending.push({ label, vars, ignored });
          }
          for (const name of words(env.OPENBAO_REPO)) {
            const label = `ocs/ci/${env.REPO_NAME}/${name}`;
            const data = await read(`ocs/data/ci/${env.REPO_NAME}/${name}`, label, 'An operator stores it (csc-ocs-ansible scripts/ci-secrets, or bao kv put); a pipeline never writes it.');
            if (typeof data.value !== 'string') throw new Error(`${label} has no string key 'value'.`);
            pending.push({ label, vars: [[name, data.value]], ignored: [] });
          }

          // --- export. Every value is masked, line by line too (a PEM key spans
          // lines and each line can be printed on its own), before export.
          for (const { label, vars, ignored } of pending) {
            for (const [name, value] of vars) {
              core.setSecret(value);
              for (const line of value.split(/\r?\n/)) if (line.trim()) core.setSecret(line);
              core.exportVariable(name, value);
            }
            core.info(`${label}: exported ${vars.length ? vars.map(([n]) => n).join(', ') : 'nothing'}${ignored.length ? `; ignored fields: ${ignored.join(', ')}` : ''}`);
          }
          core.info(`devsecops layout: ${kind} build, role ${role}, tools ${tools.join(' ')}`);
