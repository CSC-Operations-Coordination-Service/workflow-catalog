name: "Nexus context setup"
description: >
  Configure pip (install/pull) and twine (publish) for a Nexus context.

  Renders the committed context pip.conf and the shared .pypirc into $HOME,
  substituting the ${NEXUS_HOST} / ${NEXUS_PORT} placeholders from secrets, and
  exports PIP_CONFIG_FILE + TWINE_REPOSITORY.

  The action ships embedded templates under its own root, so callers can use
  the default config-dir and avoid storing pip/.pypirc templates in every repo.

  Committed config holds no host and no credentials. At runtime:
    - host/port come from the nexus-host / nexus-port inputs (pip and twine
      cannot expand env vars inside their own config files).
    - pip credentials come from a ~/.netrc this action writes, when
      nexus-username / nexus-password are supplied.
    - twine credentials come from TWINE_USERNAME / TWINE_PASSWORD, which the
      calling workflow sets on the publish step — not handled here.

inputs:
  context:
    description: "Nexus context to use: 'dev' or 'prod'"
    required: true
  config-dir:
    description: "Directory holding pip.<context>.conf and .pypirc, relative to the action root."
    required: false
    default: "."
  nexus-host:
    description: >
      Nexus hostname, no scheme and no port — pass the NEXUS_HOST secret.
      Example: oep-sysma-mondb-02.ocs.local
    required: true
  nexus-port:
    description: >
      Nexus port — pass the NEXUS_PORT secret. Leave empty for the scheme
      default (80/443), in which case ':<port>' is dropped from the URL.
    required: false
    default: ""
  nexus-username:
    description: >
      Nexus user for pip reads — pass the NEXUS_USERNAME secret. Leave empty if
      the index allows anonymous read; no .netrc is written in that case.
    required: false
    default: ""
  nexus-password:
    description: "Nexus password/token for pip reads — pass the NEXUS_PASSWORD secret."
    required: false
    default: ""

outputs:
  context:
    description: "The resolved context (echoes the input, for convenience)"
    value: ${{ inputs.context }}

runs:
  using: "composite"
  steps:
    - name: Render Nexus ${{ inputs.context }} config
      shell: bash
      env:
        CTX: ${{ inputs.context }}
        CONFIG_DIR: ${{ inputs.config-dir }}
        NEXUS_HOST: ${{ inputs.nexus-host }}
        NEXUS_PORT: ${{ inputs.nexus-port }}
      run: |
        set -euo pipefail

        if [ "$CTX" != "dev" ] && [ "$CTX" != "prod" ]; then
          echo "::error::nexus-context: 'context' must be 'dev' or 'prod' (got '$CTX')"
          exit 1
        fi
        if [ -z "$NEXUS_HOST" ]; then
          echo "::error::nexus-context: 'nexus-host' is required (set the NEXUS_HOST secret)"
          exit 1
        fi
        case "$NEXUS_HOST" in
          *://*|*/*|*:*)
            echo "::error::nexus-context: 'nexus-host' must be a bare hostname — no scheme, port or path (got '$NEXUS_HOST')"
            exit 1 ;;
        esac
        if [ -n "$NEXUS_PORT" ]; then
          case "$NEXUS_PORT" in
            *[!0-9]*)
              echo "::error::nexus-context: 'nexus-port' must be numeric (got '$NEXUS_PORT')"
              exit 1 ;;
          esac
        fi

        # sed replacement text is not literal: escape / and & in the values.
        esc() { printf '%s' "$1" | sed -e 's/[\/&]/\\&/g'; }
        host_esc=$(esc "$NEXUS_HOST")
        port_esc=$(esc "$NEXUS_PORT")

        render() {
          # With no port, drop the ':${NEXUS_PORT}' pair outright so we never
          # emit a dangling 'http://host:/path'.
          if [ -z "$NEXUS_PORT" ]; then
            sed -e 's/:\${NEXUS_PORT}//g' -e "s/\${NEXUS_HOST}/$host_esc/g" "$1"
          else
            sed -e "s/\${NEXUS_PORT}/$port_esc/g" -e "s/\${NEXUS_HOST}/$host_esc/g" "$1"
          fi
        }

        render "$CONFIG_DIR/pip.$CTX.conf" > "$HOME/pip.conf"
        render "$CONFIG_DIR/.pypirc"       > "$HOME/.pypirc"

        # Any placeholder left over means a typo in the template — fail loudly
        # rather than shipping a literal '${...}' to pip.
        for f in "$HOME/pip.conf" "$HOME/.pypirc"; do
          if grep -q '\${' "$f"; then
            echo "::error::nexus-context: unsubstituted placeholder left in $(basename "$f"): $(grep -o '\${[A-Za-z_]*}' "$f" | sort -u | tr '\n' ' ')"
            exit 1
          fi
        done

        echo "PIP_CONFIG_FILE=$HOME/pip.conf" >> "$GITHUB_ENV"
        echo "TWINE_REPOSITORY=nexus-$CTX" >> "$GITHUB_ENV"

        echo "Rendered '$CTX' context from '$CONFIG_DIR':"
        grep -E '^\s*(index-url|trusted-host)' "$HOME/pip.conf" | sed 's/^/  /'

    - name: Write ~/.netrc for pip
      shell: bash
      env:
        NEXUS_USER: ${{ inputs.nexus-username }}
        NEXUS_PASS: ${{ inputs.nexus-password }}
      run: |
        set -euo pipefail

        if [ -z "$NEXUS_USER" ] && [ -z "$NEXUS_PASS" ]; then
          echo "No Nexus credentials supplied — assuming anonymous read, skipping .netrc"
          exit 0
        fi
        if [ -z "$NEXUS_USER" ] || [ -z "$NEXUS_PASS" ]; then
          echo "::error::nexus-context: set both 'nexus-username' and 'nexus-password', or neither"
          exit 1
        fi

        # Read the host back out of the RENDERED pip.conf, so the netrc entry and
        # the index pip actually uses can never disagree.
        index_url=$(awk '
          /^[[:space:]]*index-url[[:space:]]*=/ {
            sub(/^[^=]*=[[:space:]]*/, "")
            sub(/[[:space:]]+$/, "")
            print
            exit
          }' "$HOME/pip.conf")

        if [ -z "$index_url" ]; then
          echo "::error::nexus-context: no index-url found in rendered $HOME/pip.conf"
          exit 1
        fi

        host_port="${index_url#*://}"   # drop scheme
        host_port="${host_port%%/*}"    # drop path
        host_port="${host_port##*@}"    # drop any userinfo
        host="${host_port%%:*}"         # drop port — pip matches netrc on the
                                        # bare host, a 'machine host:port' entry
                                        # is silently never found

        umask 077
        printf 'machine %s\nlogin %s\npassword %s\n' \
          "$host" "$NEXUS_USER" "$NEXUS_PASS" > "$HOME/.netrc"
        chmod 600 "$HOME/.netrc"
        echo "Wrote $HOME/.netrc for machine '$host'"
